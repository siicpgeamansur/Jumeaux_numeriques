<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jumeau numérique MaxPID · SII PCSI/PSI*</title>
<style>
  :root{
    --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
    --bg:#ffffff;--bar:#eeeeee;--panel:#ffffff;--panel2:#f1f3f6;--field:#ffffff;--line:#b9bfc7;
    --fg:#111111;--muted:#5a6068;--accent:#2e6da4;--accent-fg:#ffffff;--accent-soft:#dcebf8;--accent-ink:#1b4a76;
    --ok:#1e7a2e;--warn:#9a5b00;--bad:#c0281f;--violet:#7b4fc2;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui)}
  .inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #app{height:100%;display:flex;flex-direction:column;min-height:0}
  .band{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
  .row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.01em}
  .brand small{font-weight:400;color:var(--muted);font-size:13px}
  .files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .btn{font-weight:500;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  .btn.sm{padding:3px 8px;font-size:12px}
  :is(button,input,select,textarea,summary):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:100%;overflow-x:auto}
  .seg button{border:0;background:transparent;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
  .work{flex:1;min-height:0;display:flex;gap:10px;padding-block:10px}
  #stage{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
  #hint{flex:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bar)}

  .tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}

  .tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

  .fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-size:12.5px;color:var(--muted)}
  input[type=text],input[type=number],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--fg)}

  .defi{border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;margin:0 0 12px}.defi p{margin:6px 0}
  .defi summary{cursor:pointer;font-weight:500;color:var(--accent-ink)}
  fieldset.q{border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px;margin:0 0 10px;min-width:0}
  fieldset.q legend{font-weight:600;padding:0 4px;max-width:100%}
  .opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;cursor:pointer}
  .opt input{margin-top:3px;width:auto;flex:none}
  .opt.good{background:rgba(30,122,46,.15)}.opt.bad{background:rgba(192,40,31,.15)}
  .why{font-size:12.5px;color:var(--muted);margin:6px 4px 2px}
  .score{font-weight:600;font-size:15px;margin:4px 0 8px}
  #course{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
  .ctop,.cwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .ctop{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--bar)}
  .cwrap{flex:1;min-height:0;display:flex;gap:28px;padding-block:14px}
  .ctoc{flex:none;width:250px;overflow:auto;display:flex;flex-direction:column;gap:1px}

  .ctoc button.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .ctoc-sel{display:none;margin:8px max(16px,env(safe-area-inset-left,0px)) 0;width:auto}
  .cbody{flex:1;min-width:0;overflow:auto;max-width:860px;padding-right:6px}

  .cbody p,.cbody li{font-size:14.5px;line-height:1.6}
  .cbody ul,.cbody ol{padding-left:22px}.cbody li{margin-bottom:4px}
  .cbody table{display:block;overflow-x:auto;max-width:100%}
  .ctable{border-collapse:collapse;font-size:13.5px;margin:8px 0 12px}
  .ctable th,.ctable td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
  .ctable th{background:var(--panel2);font-weight:600}
  .retain{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 12px;margin:16px 0 6px;font-size:14px}
  .formula{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;font-size:15px;overflow-x:auto;font-family:var(--font-mono)}
  pre.code{font:12.5px/1.55 var(--font-mono);margin:8px 0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
  .gloss{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;font-size:14px}.gloss dt{font-weight:600}.gloss dd{margin:0}
  .cpn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 32px}
  #ws{padding:16px max(16px,env(safe-area-inset-left,0px)) 30px;max-width:980px}
  #ws h2{font-size:24px;margin:0 0 8px;text-wrap:balance}
  #ws h3{font-size:16.5px;margin:24px 0 6px}
  #ws p,#ws li{font-size:14.5px;line-height:1.55}
  #ws .small{font-size:12.5px}
  .opts{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 10px}.opts .fld{margin:0}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
  .chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  .gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
  .stat{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
  .stat span{font-size:12px;color:var(--muted)}.stat b{font-size:14px;font-family:var(--font-mono);overflow-wrap:anywhere}
  .verdict{border-radius:8px;padding:9px 12px;margin:10px 0;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
  .verdict.yes{background:rgba(30,122,46,.15);border-color:var(--ok)}.verdict.no{background:rgba(192,40,31,.13);border-color:var(--bad)}.verdict.warn{background:rgba(154,91,0,.13);border-color:var(--warn)}
  .canvas-wrap{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;margin:8px 0;overflow-x:auto}
  canvas{display:block;max-width:100%;height:auto}
  .legend{display:flex;gap:10px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0}
  .legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:2px;margin-right:4px}
  @media (max-width:820px){
    .ctoc{display:none}.ctoc-sel{display:block}.cwrap{padding-top:8px}.cbody{padding-right:0}.gloss{grid-template-columns:1fr}.gloss dd{margin-bottom:6px}
    #act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px)}
    .work{flex-direction:column;gap:8px}
  }
</style>

<body>
<div id="app">
  <header class="band"><div class="inner row">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="3" y="14" width="4" height="9" fill="var(--accent)"/><rect x="9" y="9" width="4" height="14" fill="var(--ok)"/><rect x="15" y="5" width="4" height="18" fill="var(--warn)"/><rect x="21" y="11" width="2.5" height="12" fill="var(--bad)"/></svg>
      <span>Jumeau numérique MaxPID <small>SII · PCSI/PSI*</small></span>
    </div>
    <div class="files">
      <button class="btn" id="bAct" type="button" aria-pressed="false">Activité</button>
      <button class="btn" id="bCourse" type="button" aria-pressed="false">Cours</button>
      <button class="btn" id="bHelp" type="button">Aide</button>
    </div>
  </div></header>

  <div class="band" id="modes"><div class="inner row"><div class="seg" id="wsSeg" role="tablist" aria-label="Ateliers"></div></div></div>

  <main class="inner work" id="work">
    <section id="stage"><div id="hint"></div><div id="scroller"><div id="ws"></div></div></section>
    <aside id="act" hidden aria-label="Activité"></aside>
  </main>

  <section id="course" hidden aria-label="Cours"></section>
</div>

<div id="dlg" hidden></div>
<div id="toast" hidden></div>

<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
function isSmall(){ try { return window.matchMedia('(max-width:820px)').matches; } catch(e){ return false; } }
const KEYS = { act: 'maxpid-jumeau-v2' };
function lsGet(k,d){ try { const v=localStorage.getItem(k); return v?JSON.parse(v):d; } catch(e){ return d; } }
function lsSet(k,v){ try { localStorage.setItem(k,JSON.stringify(v)); } catch(e){} }

/* ==================================================================
   MODÈLE MAXPID : paramètres, cinématique, statique, dynamique
   ================================================================== */
const MAXPID = {
  // Géométrie (mm) — d'après cahier-de-prepa.fr
  a: 70, b: 80, c: 80, p: 4, // p = pas de la vis en mm/tr
  // Moteur CC
  R: 1.1, Ke: 0.265, Kc: 0.265,
  Umax: 24, // V
  // Mécanique
  r: 50, // rapport de réduction
  m_bras: 0.32, // kg (bras + écrou + masses éventuelles)
  L_bras: 0.08, // m (longueur équivalente du bras)
  fv: 0.0008, // frottement visqueux ramené N·m·s/rad
  Cf: 0.012, // frottement sec ramené N·m
  // Modèle 1er ordre identifié
  Km: 12, tau: 0.08,
  // Simulation
  dt: 0.002, T: 3
};

/* --- Cinématique : loi entrée-sortie --- */
// x = p/(2π) · θ_moteur  (vis-écrou)
// Le bras est articulé : la relation θ_bras(α_m) est non linéaire.
// On utilise le modèle géométrique simplifié du MaxPID (voir TP fermeture géométrique).
function thetaBras(alphaM) {
  // alphaM en rad (rotation vis) ; x = p/(2π)·alphaM (en mm)
  const { a, b, c, p } = MAXPID;
  const x = (p / (2 * Math.PI)) * alphaM; // mm
  // Loi entrée-sortie issue de la fermeture géométrique (forme simplifiée)
  // c² = a² + b² + x² − 2·a·b·cos(θ) + 2·a·x·sin(θ)  → on résout numériquement
  // Pour la simulation, on utilise une approximation linéarisée autour de θ₀ = 0
  // θ ≈ atan( (x) / (a + b) )  (modèle linéarisé)
  const theta = Math.atan2(x, a + b); // rad
  return theta;
}
// Inverse (linéarisé) : alphaM ≈ (a+b)·tan(θ)·2π/p
function alphaMFromTheta(theta) {
  const { a, b, p } = MAXPID;
  return (a + b) * Math.tan(theta) * 2 * Math.PI / p;
}

/* --- Inertie équivalente ramenée à l'arbre moteur --- */
function inertieEquivalente(m = MAXPID.m_bras) {
  // J_eq = J_moteur + J_vis + (m·L²)/r²  + termes cinématiques
  const J_moteur = 0.0025; // kg·m²
  const J_vis = 0.0001;    // kg·m²
  const J_bras = m * MAXPID.L_bras * MAXPID.L_bras; // kg·m² (bras + masse)
  return J_moteur + J_vis + J_bras / (MAXPID.r * MAXPID.r);
}

/* --- Couple de maintien statique (masse + gravité) --- */
function coupleMaintien(thetaDeg) {
  // θ en deg ; le bras est supposé dans un plan vertical (inclinaison)
  const theta = thetaDeg * Math.PI / 180;
  const g = 9.81;
  const m = MAXPID.m_bras;
  const L = MAXPID.L_bras;
  // Couple dû au poids du bras : C = m·g·L·cos(θ)  (bras horizontal → θ=0)
  return m * g * L * Math.cos(theta); // N·m
}

/* --- Non-linéarités SLCI : saturation, frottement sec, jeu --- */
function nonLinearites(u, omega, params) {
  let uc = u;
  // Saturation tension
  uc = Math.max(-MAXPID.Umax, Math.min(MAXPID.Umax, uc));
  // Frottement sec (opposé au mouvement)
  const sign = Math.sign(omega);
  const Cf = params.Cf || MAXPID.Cf;
  // Le frottement sec n'agit que si la vitesse est non nulle
  const coupleFrottement = (Math.abs(omega) > 1e-6) ? -sign * Cf : 0;
  return { uc, coupleFrottement };
}

/* --- Simulation complète --- */
function simulerMaxpid(params) {
  const { Kp, Ki, Kd, consigne, type, T, masse, inclinaison, frottementSec, jeu } = params;
  const dt = MAXPID.dt, N = Math.floor(T / dt);
  const t = new Float64Array(N), theta = new Float64Array(N), omega = new Float64Array(N),
        u = new Float64Array(N), err = new Float64Array(N), couple = new Float64Array(N);
  let theta_m = 0; // position mesurée (degrés)
  let omega_m = 0; // vitesse moteur (rad/s)
  let integral = 0, prev_err = 0;
  const m = masse || MAXPID.m_bras;
  const J = inertieEquivalente(m);
  const incl = (inclinaison || 0) * Math.PI / 180; // inclinaison du plan (0 = horizontal)
  for (let k = 0; k < N; k++) {
    const tk = k * dt; t[k] = tk;
    // Consigne
    let c = 0;
    if (type === 'echelon') c = (tk >= 0.1) ? consigne : 0;
    else if (type === 'rampe') c = (tk >= 0.1) ? consigne * (tk - 0.1) : 0;
    else if (type === 'trapeze') { const t1=0.3,t2=0.8,t3=1.3; if(tk<0.1)c=0; else if(tk<t1)c=consigne*(tk-0.1)/(t1-0.1); else if(tk<t2)c=consigne; else if(tk<t3)c=consigne*(1-(tk-t2)/(t3-t2)); else c=0; }
    const e = c - theta_m; err[k] = e;
    integral += e * dt;
    const deriv = (e - prev_err) / dt;
    let uc = Kp * e + Ki * integral + Kd * deriv;
    // Non-linéarités
    const nl = nonLinearites(uc, omega_m, { Cf: frottementSec ? MAXPID.Cf : 0 });
    u[k] = nl.uc;
    // Couple de maintien (statique) + couple moteur
    const Cm = MAXPID.Kc * (nl.uc / MAXPID.R); // couple moteur approché (i = u/R)
    // Couple résistant : gravité + frottement visqueux + frottement sec
    const Cg = m * 9.81 * MAXPID.L_bras * Math.cos(theta_m * Math.PI / 180 + incl);
    const Cvisq = MAXPID.fv * omega_m;
    couple[k] = Cm - Cg - Cvisq + nl.coupleFrottement;
    // Dynamique : J·dω/dt = couple net (ramené à l'arbre moteur)
    omega_m += (couple[k] / J) * dt;
    // Position (degrés) : θ_bras = (1/r)·(180/π)·∫ω dt
    theta_m += (180 / Math.PI) * omega_m / MAXPID.r * dt;
    // Jeu (approximatif) : on ajoute un petit retard/zone morte
    if (jeu && Math.abs(theta_m - c) < 0.2) theta_m = c;
    theta[k] = theta_m; omega[k] = omega_m;
    prev_err = e;
  }
  // Indicateurs
  const final = theta[N-1];
  const err_stat = consigne - final;
  let depassement = 0;
  if (type === 'echelon') {
    let maxv = -Infinity;
    for (let k = 0; k < N; k++) if (theta[k] > maxv) maxv = theta[k];
    depassement = Math.max(0, (maxv - consigne) / consigne * 100);
  }
  let t5 = T;
  for (let k = 0; k < N; k++) if (Math.abs(theta[k] - consigne) <= 0.05 * Math.abs(consigne)) { t5 = t[k]; break; }
  return { t, theta, omega, u, err, couple, final, err_stat, depassement, t5, consigne, J, m };
}

/* ==================================================================
   ANIMATION 2D DU BRAS
   ================================================================== */
function dessinerBras(canvas, thetaDeg, params) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.75;
  const L = Math.min(W, H) * 0.55;
  const theta = thetaDeg * Math.PI / 180;
  // Bâti
  ctx.fillStyle = '#5a6068';
  ctx.fillRect(cx - 30, cy + 5, 60, 12);
  ctx.fillStyle = '#b9bfc7';
  ctx.fillRect(cx - 40, cy + 17, 80, 6);
  // Bras
  const bx = cx + L * Math.sin(theta);
  const by = cy - L * Math.cos(theta);
  ctx.strokeStyle = '#2e6da4';
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(bx, by); ctx.stroke();
  ctx.strokeStyle = '#1b4a76';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(bx, by); ctx.stroke();
  // Pivot
  ctx.fillStyle = '#c0281f';
  ctx.beginPath(); ctx.arc(cx, cy, 7, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx, cy, 3, 0, 2 * Math.PI); ctx.fill();
  // Masse au bout
  ctx.fillStyle = '#9a5b00';
  ctx.beginPath(); ctx.arc(bx, by, 8, 0, 2 * Math.PI); ctx.fill();
  // Arc de cercle (référence)
  ctx.strokeStyle = '#b9bfc7';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.arc(cx, cy, L * 0.6, -Math.PI / 2, -Math.PI / 2 + theta, false); ctx.stroke();
  ctx.setLineDash([]);
  // Texte
  ctx.fillStyle = '#5a6068';
  ctx.font = '12px IBM Plex Sans, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('θ = ' + thetaDeg.toFixed(1) + '°', cx, cy + 40);
  // Consigne
  if (params && params.consigne != null) {
    const tc = params.consigne * Math.PI / 180;
    ctx.strokeStyle = '#9a5b00';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + L * Math.sin(tc), cy - L * Math.cos(tc));
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

/* ==================================================================
   ATELIERS

/* --- Atelier 1 : jumeau numérique avec animation 2D --- */
function mountJumeau(root) {
  root.innerHTML = `
    <h2>Jumeau numérique du MaxPID</h2>
    <p>Le modèle linéarisé du premier ordre en vitesse est complété par la <b>loi entrée-sortie</b> de la vis-écrou, le <b>couple de maintien</b> gravitaire et une <b>inertie équivalente</b> ramenée à l'arbre moteur. L'animation 2D montre le bras en temps réel, synchronisé avec les courbes.</p>
    <div class="opts">
      <label class="fld"><span>Consigne (°)</span><input type="number" id="j-cons" value="60" min="5" max="90" step="5"></label>
      <div class="fld"><span>Type d'entrée</span><div id="j-type"></div></div>
      <label class="fld"><span>K<sub>p</sub></span><input type="range" id="j-kp" min="0" max="50" step="1" value="8"><b id="j-kp-out">8</b></label>
      <label class="fld"><span>K<sub>i</sub></span><input type="range" id="j-ki" min="0" max="20" step="0.5" value="0"><b id="j-ki-out">0</b></label>
      <label class="fld"><span>K<sub>d</sub></span><input type="range" id="j-kd" min="0" max="2" step="0.05" value="0"><b id="j-kd-out">0</b></label>
      <label class="fld"><span>Masse (kg)</span><input type="range" id="j-masse" min="0.1" max="1.5" step="0.1" value="0.32"><b id="j-masse-out">0.32</b></label>
    </div>
    <div class="opts">
      <label class="fld"><span>Inclinaison (°)</span><input type="range" id="j-incl" min="-30" max="30" step="5" value="0"><b id="j-incl-out">0</b></label>
      <label class="fld"><span><input type="checkbox" id="j-frot"> Frottement sec</span></label>
      <label class="fld"><span><input type="checkbox" id="j-jeu"> Jeu (zone morte)</span></label>
      <button class="btn pri" id="j-run" type="button">Simuler</button>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin:8px 0">
      <div class="canvas-wrap" style="flex:1;min-width:280px"><canvas id="j-bras" width="320" height="240"></canvas></div>
      <div class="canvas-wrap" style="flex:2;min-width:320px"><canvas id="j-canvas" width="640" height="300"></canvas></div>
    </div>
    <div class="legend"><span><i style="background:#2e6da4"></i>Position θ (°)</span><span><i style="background:#9a5b00"></i>Consigne</span><span><i style="background:#1e7a2e"></i>Vitesse moteur (/10)</span><span><i style="background:#c0281f"></i>Tension u (/5)</span><span><i style="background:#7b4fc2"></i>Couple (N·m, échelle)</span></div>
    <div id="j-indic"></div>
    <div id="j-msg" class="verdict" aria-live="polite"></div>
  `;
  const typeEl = $('#j-type');
  typeEl.append(h('div', {class:'chips'}, [['echelon','Échelon'],['rampe','Rampe'],['trapeze','Trapèze']].map(([id,lab])=>{
    const b = h('button',{type:'button',class:'chip'+(id==='echelon'?' on':''),'data-type':id,onclick:()=>{ typeEl.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); b.classList.add('on'); drawJumeau(); }},lab);
    return b;
  })));
  ['kp','ki','kd','masse','incl'].forEach(id => {
    const el = $('#j-'+id), out = $('#j-'+id+'-out');
    if (el && out) el.addEventListener('input', ()=>{ out.textContent = el.value; drawJumeau(); });
  });
  $('#j-frot').addEventListener('change', drawJumeau);

  $('#j-run').addEventListener('click', drawJumeau);

}

function drawJumeau() {
  const canvas = $('#j-canvas'); if (!canvas) return;
  const brasCanvas = $('#j-bras');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  const type = $('#j-type')?.querySelector('.chip.on')?.dataset.type || 'echelon';
  const cons = parseFloat($('#j-cons')?.value) || 60;
  const Kp = parseFloat($('#j-kp')?.value) || 0;
  const Ki = parseFloat($('#j-ki')?.value) || 0;
  const Kd = parseFloat($('#j-kd')?.value) || 0;
  const masse = parseFloat($('#j-masse')?.value) || MAXPID.m_bras;
  const incl = parseFloat($('#j-incl')?.value) || 0;
  const frottementSec = $('#j-frot')?.checked || false;
  const jeu = $('#j-jeu')?.checked || false;
  const res = simulerMaxpid({ Kp, Ki, Kd, consigne: cons, type, T: 3, masse, inclinaison: incl, frottementSec, jeu });
  const N = res.t.length;
  // Échelles
  const maxTheta = Math.max(cons, ...res.theta) * 1.1 || 1;
  const maxOmega = Math.max(1, ...res.omega) * 1.1;
  const maxCouple = Math.max(1, ...res.couple.map(Math.abs)) * 1.2;
  const pad = { l: 50, r: 15, t: 15, b: 30 };
  const plotW = W - pad.l - pad.r, plotH = H - pad.t - pad.b;
  const x = i => pad.l + (i / (N-1)) * plotW;
  const yTheta = v => pad.t + plotH - (v / maxTheta) * plotH;
  const yOmega = v => pad.t + plotH - (v / maxOmega) * plotH;
  const yU = v => pad.t + plotH - ((v + MAXPID.Umax) / (2*MAXPID.Umax)) * plotH;
  const yC = v => pad.t + plotH - ((v + maxCouple) / (2*maxCouple)) * plotH;
  // Grille
  ctx.strokeStyle = '#d0d5db'; ctx.lineWidth = 0.8;
  for (let g = 0; g <= 4; g++) { const yy = pad.t + (g/4)*plotH; ctx.beginPath(); ctx.moveTo(pad.l, yy); ctx.lineTo(W-pad.r, yy); ctx.stroke(); }
  ctx.strokeStyle = '#5a6068'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(pad.l, pad.t); ctx.lineTo(pad.l, H-pad.b); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pad.l, H-pad.b); ctx.lineTo(W-pad.r, H-pad.b); ctx.stroke();
  ctx.fillStyle = '#5a6068'; ctx.font = '11px IBM Plex Mono, monospace'; ctx.textAlign = 'right';
  for (let g = 0; g <= 4; g++) { const val = maxTheta * (1 - g/4); ctx.fillText(val.toFixed(0), pad.l-5, pad.t + (g/4)*plotH + 4); }
  ctx.textAlign = 'center';
  for (let g = 0; g <= 4; g++) { const tt = (g/4)*res.T; ctx.fillText(tt.toFixed(1)+'s', pad.l + (g/4)*plotW, H-pad.b+15); }
  // Consigne
  ctx.strokeStyle = '#9a5b00'; ctx.lineWidth = 1.8; ctx.setLineDash([5,4]);
  ctx.beginPath();
  for (let i = 0; i < N; i+=2) {
    let c = 0; const tk = res.t[i];
    if (type === 'echelon') c = tk >= 0.1 ? cons : 0;
    else if (type === 'rampe') c = tk >= 0.1 ? cons*(tk-0.1) : 0;
    else { const t1=0.3,t2=0.8,t3=1.3; if(tk<0.1)c=0; else if(tk<t1)c=cons*(tk-0.1)/(t1-0.1); else if(tk<t2)c=cons; else if(tk<t3)c=cons*(1-(tk-t2)/(t3-t2)); else c=0; }
    const xx = x(i), yy = yTheta(c); i===0 ? ctx.moveTo(xx,yy) : ctx.lineTo(xx,yy);
  }
  ctx.stroke(); ctx.setLineDash([]);
  // Position
  ctx.strokeStyle = '#2e6da4'; ctx.lineWidth = 2.2;
  ctx.beginPath();
  for (let i = 0; i < N; i+=2) { const xx = x(i), yy = yTheta(res.theta[i]); i===0 ? ctx.moveTo(xx,yy) : ctx.lineTo(xx,yy); }
  ctx.stroke();
  // Vitesse
  ctx.strokeStyle = '#1e7a2e'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < N; i+=2) { const xx = x(i), yy = yOmega(res.omega[i]/10); i===0 ? ctx.moveTo(xx,yy) : ctx.lineTo(xx,yy); }
  ctx.stroke();
  // Tension
  ctx.strokeStyle = '#c0281f'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (let i = 0; i < N; i+=2) { const xx = x(i), yy = yU(res.u[i]/5); i===0 ? ctx.moveTo(xx,yy) : ctx.lineTo(xx,yy); }
  ctx.stroke();
  // Couple
  ctx.strokeStyle = '#7b4fc2'; ctx.lineWidth = 1.0;
  ctx.beginPath();
  for (let i = 0; i < N; i+=2) { const xx = x(i), yy = yC(res.couple[i]); i===0 ? ctx.moveTo(xx,yy) : ctx.lineTo(xx,yy); }
  ctx.stroke();
  // Animation 2D du bras (position finale)
  if (brasCanvas) dessinerBras(brasCanvas, res.final, { consigne: cons });
  // Indicateurs
  const box = $('#j-indic'); if (box) {
    box.innerHTML = '';
    box.append(h('div',{class:'gstats'},[
      ['Erreur statique', res.err_stat.toFixed(2)+' °'],
      ['Dépassement', (type==='echelon'? res.depassement.toFixed(1):'—')+' %'],
      ['Temps de réponse à 5%', res.t5.toFixed(2)+' s'],
      ['Inertie équivalente J<sub>eq</sub>', (res.J*1000).toFixed(2)+' g·m²'],
      ['Couple de maintien', coupleMaintien(res.final).toFixed(3)+' N·m']
    ].map(([lab,val])=>h('div',{class:'stat'},h('span',{html:lab}),h('b',null,val)))));
  }
  const msg = $('#j-msg'); if (msg) {
    let txt = '';
    if (res.err_stat > 1 && Ki === 0) txt = 'Erreur statique non nulle : un correcteur proportionnel seul ne l’annule pas.';
    else if (res.depassement > 20) txt = 'Dépassement important : augmentez K<sub>d</sub> ou réduisez K<sub>p</sub>.';
    else if (frottementSec && res.depassement > 10) txt = 'Le frottement sec provoque un dépassement supplémentaire (effet de collage-décollage).';
    else txt = 'Comportement correct. L’animation 2D montre le bras à la position finale.';
    msg.innerHTML = txt;
  }
}

/* --- Atelier 2 : cinématique --- */
function mountCinematique(root) {
  root.innerHTML = `
    <h2>Cinématique : loi entrée-sortie</h2>
    <p>Le bras MaxPID est actionné par un système <b>vis-écrou</b> : la rotation de la vis (α<sub>m</sub>) produit une translation de l’écrou (x), qui fait tourner le bras (θ). La loi entrée-sortie relie θ à α<sub>m</sub>.</p>
    <div class="formula">x(t) = (p / 2π) · α<sub>m</sub>(t)   (vis-écrou, p = 4 mm/tr)</div>
    <p>La fermeture géométrique du mécanisme (voir TP “fermeture géométrique”) donne une relation non linéaire entre x et θ. Dans le domaine linéarisé autour de θ = 0, on obtient :</p>
    <div class="formula">θ ≈ atan( x / (a + b) )   avec a = 70 mm, b = 80 mm</div>
    <div class="opts">
      <label class="fld"><span>Rotation vis α<sub>m</sub> (°)</span><input type="range" id="c-alpha" min="-360" max="360" step="5" value="0"><b id="c-alpha-out">0</b></label>
    </div>
    <div class="canvas-wrap"><canvas id="c-canvas" width="640" height="240"></canvas></div>
    <div id="c-out" class="gstats"></div>
    <div class="verdict" id="c-msg"></div>
  `;
  $('#c-alpha').addEventListener('input', drawCinematique);
  drawCinematique();
}

function drawCinematique() {
  const alphaDeg = parseFloat($('#c-alpha')?.value) || 0;
  $('#c-alpha-out').textContent = alphaDeg;
  const alpha = alphaDeg * Math.PI / 180;
  const x = (MAXPID.p / (2 * Math.PI)) * alpha; // mm
  const thetaRad = thetaBras(alpha);
  const thetaDeg = thetaRad * 180 / Math.PI;
  // Tracé
  const canvas = $('#c-canvas'); if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  // Représentation schématique : vis horizontale, écrou, bras
  const cx = W * 0.3, cy = H * 0.7;
  const L = H * 0.5;
  ctx.strokeStyle = '#5a6068'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W*0.1, cy); ctx.lineTo(W*0.9, cy); ctx.stroke(); // bâti
  // Vis
  ctx.strokeStyle = '#2e6da4'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(cx - 40, cy - 10); ctx.lineTo(cx + 40, cy - 10); ctx.stroke();
  // Écrou
  const ex = cx + x * 2; // échelle visuelle
  ctx.fillStyle = '#9a5b00';
  ctx.fillRect(ex - 8, cy - 18, 16, 16);
  // Bras
  const bx = ex + L * Math.sin(thetaRad);
  const by = cy - L * Math.cos(thetaRad);
  ctx.strokeStyle = '#1e7a2e'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(ex, cy - 10); ctx.lineTo(bx, by); ctx.stroke();
  ctx.fillStyle = '#c0281f';
  ctx.beginPath(); ctx.arc(ex, cy - 10, 5, 0, 2*Math.PI); ctx.fill();
  ctx.fillStyle = '#5a6068'; ctx.font = '12px IBM Plex Sans'; ctx.textAlign = 'center';
  ctx.fillText('αm = ' + alphaDeg.toFixed(0) + '°', W/2, H - 10);
  // Indicateurs
  const box = $('#c-out'); if (box) {
    box.innerHTML = '';
    box.append(h('div',{class:'gstats'},[
      ['Translation x', x.toFixed(2)+' mm'],
      ['Angle bras θ', thetaDeg.toFixed(2)+' °'],
      ['Rapport θ/x', (thetaDeg/x).toFixed(3)+' °/mm']
    ].map(([lab,val])=>h('div',{class:'stat'},h('span',{html:lab}),h('b',null,val)))));
  }
  const msg = $('#c-msg');
  if (msg) msg.innerHTML = `Pour une rotation de vis de ${alphaDeg}°, l’écrou se translate de x = ${x.toFixed(2)} mm, ce qui fait tourner le bras de θ ≈ ${thetaDeg.toFixed(2)}°. La loi entrée-sortie est non linéaire, mais reste localement linéarisable autour de θ = 0.`;
}

/* --- Atelier 3 : statique --- */
function mountStatique(root) {
  root.innerHTML = `
    <h2>Statique : couple de maintien</h2>
    <p>Lorsque le bras est maintenu en position, le moteur doit fournir un <b>couple de maintien</b> pour équilibrer l’action de la pesanteur. Ce couple dépend de l’angle θ et de la masse embarquée.</p>
    <div class="formula">C<sub>maintien</sub>(θ) = m · g · L · cos(θ)</div>
    <p>où m est la masse totale (bras + charge), L la longueur équivalente du bras (≈ 80 mm) et θ l’angle par rapport à l’horizontale.</p>
    <div class="opts">
      <label class="fld"><span>Angle θ (°)</span><input type="range" id="s-theta" min="0" max="90" step="5" value="45"><b id="s-theta-out">45</b></label>
      <label class="fld"><span>Masse m (kg)</span><input type="range" id="s-masse" min="0.1" max="1.5" step="0.1" value="0.32"><b id="s-masse-out">0.32</b></label>
    </div>
    <div class="canvas-wrap"><canvas id="s-canvas" width="640" height="280"></canvas></div>
    <div id="s-out" class="gstats"></div>
    <div class="verdict" id="s-msg"></div>
  `;
  $('#s-theta').addEventListener('input', drawStatique);
  $('#s-masse').addEventListener('input', drawStatique);
  drawStatique();
}

function drawStatique() {
  const thetaDeg = parseFloat($('#s-theta')?.value) || 45;
  const m = parseFloat($('#s-masse')?.value) || MAXPID.m_bras;
  $('#s-theta-out').textContent = thetaDeg;
  $('#s-masse-out').textContent = m;
  const C = coupleMaintien(thetaDeg) * (m / MAXPID.m_bras);
  // Tracé
  const canvas = $('#s-canvas'); if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const cx = W/2, cy = H*0.8;
  const L = H*0.6;
  const theta = thetaDeg * Math.PI/180;
  // Bâti
  ctx.fillStyle = '#5a6068'; ctx.fillRect(cx-30, cy+5, 60, 10);
  // Bras
  const bx = cx + L*Math.sin(theta), by = cy - L*Math.cos(theta);
  ctx.strokeStyle = '#2e6da4'; ctx.lineWidth = 8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(bx,by); ctx.stroke();
  // Masse
  ctx.fillStyle = '#9a5b00'; ctx.beginPath(); ctx.arc(bx,by,10,0,2*Math.PI); ctx.fill();
  // Poids
  ctx.strokeStyle = '#c0281f'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx, by+40); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx-5, by+30); ctx.lineTo(bx, by+40); ctx.lineTo(bx+5, by+30); ctx.stroke();
  // Couple
  ctx.fillStyle = '#7b4fc2'; ctx.font = '12px IBM Plex Mono'; ctx.textAlign='left';
  ctx.fillText('C = ' + C.toFixed(3) + ' N·m', 10, 20);
  // Indicateurs
  const box = $('#s-out'); if (box) {
    box.innerHTML = '';
    box.append(h('div',{class:'gstats'},[
      ['Angle θ', thetaDeg.toFixed(0)+' °'],
      ['Masse m', m.toFixed(2)+' kg'],
      ['Couple de maintien', C.toFixed(3)+' N·m'],
      ['Couple maximal (θ=0)', (m*9.81*MAXPID.L_bras).toFixed(3)+' N·m']
    ].map(([lab,val])=>h('div',{class:'stat'},h('span',{html:lab}),h('b',null,val)))));
  }
  const msg = $('#s-msg');
  if (msg) msg.innerHTML = `Le couple de maintien est maximal lorsque le bras est horizontal (θ = 0°) et s’annule lorsqu’il est vertical (θ = 90°). Pour θ = ${thetaDeg}° et m = ${m.toFixed(2)} kg, il vaut ${C.toFixed(3)} N·m.`;
}

/* --- Atelier 4 : inertie équivalente --- */
function mountInertie(root) {
  root.innerHTML = `
    <h2>Inertie équivalente</h2>
    <p>Pour étudier la dynamique, on ramène toutes les inerties à l’arbre moteur. L’inertie équivalente dépend de la masse embarquée et du rapport de réduction.</p>
    <div class="formula">J<sub>eq</sub> = J<sub>moteur</sub> + J<sub>vis</sub> + (m · L²) / r²</div>
    <p>Avec J<sub>moteur</sub> ≈ 2,5·10⁻³ kg·m², J<sub>vis</sub> ≈ 10⁻⁴ kg·m², L ≈ 80 mm et r = 50.</p>
    <div class="opts">
      <label class="fld"><span>Masse m (kg)</span><input type="range" id="i-masse" min="0.1" max="1.5" step="0.1" value="0.32"><b id="i-masse-out">0.32</b></label>
    </div>
    <div id="i-out" class="gstats"></div>
    <div class="verdict" id="i-msg"></div>
  `;
  $('#i-masse').addEventListener('input', drawInertie);
  drawInertie();
}

function drawInertie() {
  const m = parseFloat($('#i-masse')?.value) || MAXPID.m_bras;
  $('#i-masse-out').textContent = m;
  const J = inertieEquivalente(m);
  const Jm = 0.0025, Jv = 0.0001;
  const Jb = m * MAXPID.L_bras * MAXPID.L_bras / (MAXPID.r * MAXPID.r);
  const box = $('#i-out'); if (box) {
    box.innerHTML = '';
    box.append(h('div',{class:'gstats'},[
      ['J moteur', (Jm*1000).toFixed(2)+' g·m²'],
      ['J vis', (Jv*1000).toFixed(2)+' g·m²'],
      ['J bras ramené', (Jb*1000).toFixed(2)+' g·m²'],
      ['J équivalent total', (J*1000).toFixed(2)+' g·m²']
    ].map(([lab,val])=>h('div',{class:'stat'},h('span',{html:lab}),h('b',null,val)))));
  }
  const msg = $('#i-msg');
  if (msg) msg.innerHTML = `Le rapport de réduction r = 50 divise l’inertie du bras par r² = 2500. Pour m = ${m.toFixed(2)} kg, l’inertie du bras ramenée à l’arbre moteur ne représente que ${(Jb/J*100).toFixed(1)} % de J<sub>eq</sub>.`;
}

/* --- Atelier 5 : dynamique --- */
function mountDynamique(root) {
  root.innerHTML = `
    <h2>Dynamique : équation de mouvement</h2>
    <p>L’équation de dynamique ramenée à l’arbre moteur s’écrit :</p>
    <div class="formula">J<sub>eq</sub> · dω<sub>m</sub>/dt = C<sub>m</sub> − C<sub>r</sub> − f<sub>v</sub>·ω<sub>m</sub></div>
    <p>où C<sub>r</sub> représente le couple résistant (pesanteur, frottement sec). La constante de temps du moteur dépend de J<sub>eq</sub> :</p>
    <div class="formula">τ = R · J<sub>eq</sub> / (R·f<sub>v</sub> + K<sub>e</sub>·K<sub>c</sub>)</div>
    <div class="opts">
      <label class="fld"><span>Masse m (kg)</span><input type="range" id="d-masse" min="0.1" max="1.5" step="0.1" value="0.32"><b id="d-masse-out">0.32</b></label>
      <label class="fld"><span>Inclinaison (°)</span><input type="range" id="d-incl" min="-30" max="30" step="5" value="0"><b id="d-incl-out">0</b></label>
    </div>
    <div id="d-out" class="gstats"></div>
    <div class="verdict" id="d-msg"></div>
  `;
  $('#d-masse').addEventListener('input', drawDynamique);
  $('#d-incl').addEventListener('input', drawDynamique);
  drawDynamique();
}

function drawDynamique() {
  const m = parseFloat($('#d-masse')?.value) || MAXPID.m_bras;
  const incl = parseFloat($('#d-incl')?.value) || 0;
  $('#d-masse-out').textContent = m;
  $('#d-incl-out').textContent = incl;
  const J = inertieEquivalente(m);
  const tau = MAXPID.R * J / (MAXPID.R * MAXPID.fv + MAXPID.Ke * MAXPID.Kc);
  const Km = MAXPID.Kc / (MAXPID.R * MAXPID.fv + MAXPID.Ke * MAXPID.Kc);
  const box = $('#d-out'); if (box) {
    box.innerHTML = '';
    box.append(h('div',{class:'gstats'},[
      ['J équivalent', (J*1000).toFixed(2)+' g·m²'],
      ['Constante de temps τ', (tau*1000).toFixed(1)+' ms'],
      ['Gain statique Km', Km.toFixed(2)+' rad/s/V'],
      ['Couple résistant (θ='+incl+'°)', coupleMaintien(incl).toFixed(3)+' N·m']
    ].map(([lab,val])=>h('div',{class:'stat'},h('span',{html:lab}),h('b',null,val)))));
  }
  const msg = $('#d-msg');

}

<h3>Chaîne d’information et d’énergie</h3>

function actSave(){ lsSet(KEYS.act, AS.st); }
function actState(){ return AS.st[AS.key] || (AS.st[AS.key]={a:{},checked:false,shown:false}); }
function actScore(a){ const s=actState(); return a.qcm.filter((q,i)=>s.a[i]===q.a).length; }

function renderAct(){
  const box=$('#act'), btn=$('#bAct');
  btn.setAttribute('aria-pressed', AS.open?'true':'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open;
  if(!AS.open){ box.innerHTML=''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key+'|'+AS.tab, keep = oldB && box.dataset.k===tag ? oldB.scrollTop : 0;
  box.dataset.k = tag;
  box.innerHTML='';
  const a = ACT[AS.key];
  if(!a){ box.append(h('div',{class:'pbody'},h('p',null,'Activité en préparation.'))); return; }
  const close = h('button',{class:'btn sm',type:'button',onclick:()=>{ AS.open=false; renderAct(); }},'Fermer');
  box.append(h('div',{class:'phead'},h('b',null,'Activité'),h('span',{class:'sub'},a.title),close));
  const nq = a.qcm.length;
  box.append(h('div',{class:'tabs',role:'tablist'},
    h('button',{type:'button',role:'tab','aria-selected':AS.tab==='steps'?'true':'false',onclick:()=>{AS.tab='steps';renderAct();}},'Consignes'),
    h('button',{type:'button',role:'tab','aria-selected':AS.tab==='qcm'?'true':'false',onclick:()=>{AS.tab='qcm';renderAct();}},'Questions ('+nq+')')));
  const body = h('div',{class:'pbody'});
  if(AS.tab==='steps'){
    body.append(h('p',{class:'small'},a.level+' · environ '+a.time), h('div',{class:'goal'},h('b',null,'Objectif. '),a.goal));
    body.append(h('ol',{class:'steps'},a.steps.map(s=>h('li',{html:s}))));
    body.append(h('div',{class:'defi'},h('b',null,'Défi'),h('p',{html:a.defi.q}),h('details',null,h('summary',null,'Voir la réponse'),h('p',{html:a.defi.a}))));
    if(a.course) body.append(h('p',null,h('button',{class:'btn',type:'button',onclick:()=>openCourse(a.course)},'Voir le cours : '+courseSection(a.course).t)));
    body.append(h('p',null,h('button',{class:'btn pri',type:'button',onclick:()=>{ AS.tab='qcm'; renderAct(); }},'Passer aux questions')));
  } else {
    const s=actState(), show=s.checked||s.shown;
    a.qcm.forEach((q,i)=>{
      const fs = h('fieldset',{class:'q'},h('legend',null,(i+1)+'. '+q.q));
      q.o.forEach((o,j)=>{
        const good = show && j===q.a, bad = s.checked && !s.shown && s.a[i]===j && j!==q.a;
        const inp = h('input',{type:'radio',name:'q'+i,checked: show && s.shown ? j===q.a : s.a[i]===j,disabled:show});
        inp.addEventListener('change',()=>{ s.a[i]=j; actSave(); renderAct(); });
        fs.append(h('label',{class:'opt'+(good?' good':'')+(bad?' bad':'')},inp,h('span',null,o+(good?'  ✓':'')+(bad?'  ✗':''))));
      });
      if(show){ const miss = s.a[i]==null && !s.shown; fs.append(h('p',{class:'why'},(miss?'Sans réponse. ':'')+q.w)); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p',{class:'small'}, s.shown?'Réponses affichées.': s.checked?'':done+' réponse(s) sur '+nq+'.'));
    if(s.checked && !s.shown) body.append(h('p',{class:'score'},'Score : '+actScore(a)+' / '+nq));
    const row = h('div',{class:'files'});
    if(!show) row.append(h('button',{class:'btn pri',type:'button',onclick:()=>{ s.checked=true; actSave(); renderAct(); }},'Corriger'));
    row.append(h('button',{class:'btn',type:'button',onclick:()=>{ s.shown=true; actSave(); renderAct(); }},'Afficher les réponses'));
    if(show) row.append(h('button',{class:'btn',type:'button',onclick:()=>{ AS.st[AS.key]={a:{},checked:false,shown:false}; actSave(); renderAct(); }},'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop=keep;
}

  box.innerHTML='';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id=id; renderCourse(); };
  const nav = h('nav',{class:'ctoc','aria-label':'Sommaire du cours'},COURSE.map((s,i)=>h('button',{type:'button',class:s.id===cur.id?'on':'','aria-current':s.id===cur.id?'true':'false',onclick:()=>go(s.id)},(i+1)+'. '+s.t)));
  const sel = h('select',{class:'ctoc-sel','aria-label':'Choisir une section',onchange:e=>go(e.target.value)},COURSE.map((s,i)=>h('option',{value:s.id,selected:s.id===cur.id},(i+1)+'. '+s.t)));
  const art = h('article',{class:'cbody'});
  art.append(h('p',{class:'ckick'},'Cours · section '+(idx+1)+' sur '+COURSE.length),h('h2',null,cur.t),h('div',{html:cur.h}));
  art.append(h('div',{class:'cpn'},
    idx>0?h('button',{class:'btn',type:'button',onclick:()=>go(COURSE[idx-1].id)},'← '+COURSE[idx-1].t):h('span'),
    idx<COURSE.length-1?h('button',{class:'btn pri',type:'button',onclick:()=>go(COURSE[idx+1].id)},COURSE[idx+1].t+' →'):h('span')));
  const top = h('div',{class:'ctop'},h('b',null,'Cours : MaxPID'),h('button',{class:'btn pri sm',type:'button',onclick:()=>{ CS.open=false; renderCourse(); }},'Retour à l’atelier'));
  box.append(top,sel,h('div',{class:'cwrap'},nav,art));
  const sc=box.querySelector('.cwrap'); if(sc) sc.scrollTop=0;
}
function openCourse(id){ if(id) CS.id=id; CS.open=true; renderCourse(); }
$('#bCourse').addEventListener('click', ()=>{ CS.open=!CS.open; renderCourse(); });

function closeDlg(){ $('#dlg').hidden=true; $('#dlg').innerHTML=''; }
function openDlg(title, body){
  const d=$('#dlg'); d.innerHTML=''; d.hidden=false;
  d.append(h('div',{class:'dlgbox',role:'dialog','aria-label':title},h('header',null,h('b',null,title),h('button',{class:'btn sm',type:'button',onclick:closeDlg},'Fermer')),h('div',{class:'dbody'},body)));
  d.onclick=ev=>{ if(ev.target===d) closeDlg(); };
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click',()=>{
  openDlg('Aide', h('div',{html:`
    <p>Ce support propose un <b>jumeau numérique du MaxPID</b> avec animation 2D et six ateliers couvrant le programme de SII :</p>
    <ul>
      <li><b>Jumeau numérique</b> : PID, masse, non-linéarités, animation 2D synchronisée.</li>
      <li><b>Cinématique</b> : loi entrée-sortie vis-écrou.</li>
      <li><b>Statique</b> : couple de maintien gravitaire.</li>
      <li><b>Inertie équivalente</b> : ramenée à l’arbre moteur.</li>
      <li><b>Dynamique</b> : équation de mouvement et constante de temps.</li>
      <li><b>Non-linéarités</b> : saturation, frottement sec, jeu.</li>
    </ul>
    <p>Le bouton <b>Activité</b> ouvre les consignes et un QCM avec correction. Le bouton <b>Cours</b> donne les rappels théoriques.</p>
  `}));
});

(function init(){
  AS.open = !isSmall();
  renderSeg();
  mountWs();
  renderAct();
  renderCourse();
})();
</script>
