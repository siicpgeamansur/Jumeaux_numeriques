'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {

  if (attrs) for (const [k, v] of Object.entries(attrs)) {

    if (k === 'class') el.className = v;

    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);

function isSmall() { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } }
const KEYS = { act: 'maxpid-twin-v1' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }
let toastT = null;

const WORKSHOPS = [];
/*LOGIC-START*/
const D2R = Math.PI / 180, G0 = 9.81;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KIN = { a: 69.5, b: 82, c: 80, p: 4 };
KIN.R = Math.hypot(KIN.a, KIN.b); KIN.d = Math.atan2(KIN.b, KIN.a);
const xOf = th => Math.sqrt(KIN.a ** 2 + KIN.b ** 2 + KIN.c ** 2 + 2 * KIN.c * (KIN.a * Math.cos(th) - KIN.b * Math.sin(th)));
KIN.x0 = xOf(0); KIN.x90 = xOf(Math.PI / 2);
const thOf = x => Math.acos(clamp((x * x - KIN.a ** 2 - KIN.b ** 2 - KIN.c ** 2) / (2 * KIN.c * KIN.R), -1, 1)) - KIN.d;
const dxdth = th => KIN.c * (-KIN.a * Math.sin(th) - KIN.b * Math.cos(th)) / xOf(th);
/* gain cinématique : degrés de bras par tour de vis */
const Gdeg = thDeg => (KIN.p / Math.abs(dxdth(thDeg * D2R))) / D2R;
const betaOf = thDeg => (KIN.x0 - xOf(thDeg * D2R)) / KIN.p;
const P0 = { R: 2.32, L: 0.238e-3, kt: 0.0234, ke: 0.0234, J0: 50e-6, Jm: 8e-6, f: 2e-6, cs: 2e-3, N: 7,

const Jtot = (P, n) => P.J0 + P.Jm * n;
/* modèle linéaire du moteur (L négligée) : Km (rad/s/V), T (s) */
function motorLin(P, n) { const J = Jtot(P, n), den = P.R * P.f + P.kt * P.ke; return { Km: P.kt / den, T: P.R * J / den, T2: P.L / P.R, J }; }
/* simulation temporelle. o: {th0, thc(t)|step, kp, ki, kd, n, sat, aw, lin, open, uOpen, tend, Te, noGrav, noDry} */

<p>Le <b>MaxPID</b> est un axe asservi en position issu d’un robot cueilleur de pommes. Après détection d’un fruit, il place un organe de cueillette au contact du fruit. Le cahier des charges demande un positionnement <b>précis</b> (ne pas faire tomber le fruit) et <b>rapide</b> (grand nombre de fruits).</p>
<h3>Constituants</h3>
<table class="ctable"><tr><th>Élément</th><th>Rôle</th></tr>
<tr><td>Carte de commande</td><td>calcule l’écart consigne − position, applique le correcteur, délivre la tension moteur saturée entre −Umax et +Umax</td></tr>
<tr><td>Moteur à courant continu</td><td>convertit l’énergie électrique en énergie mécanique de rotation</td></tr>
<tr><td>Chaîne cinématique</td><td>réducteur puis vis-écrou : transforme la rotation du moteur en rotation du bras</td></tr>
<tr><td>Bras</td><td>charge mécanique, inertie variable selon les masses ajoutées</td></tr>
<tr><td>Potentiomètre + CAN</td><td>mesure l’angle du bras : 12 bits, 0 à 4095, soit 44 points par degré</td></tr></table>
<h3>Deux chaînes</h3>
<p>La <b>chaîne d’énergie</b> (alimentation, moteur, réducteur, vis, bras) transmet la puissance. La <b>chaîne d’information</b> (capteur, CAN, comparateur, correcteur) acquiert, traite et commande.</p>
<div class="retain"><b>À retenir.</b> Le MaxPID est un système asservi : on mesure la sortie θ, on la compare à la consigne θc et on corrige la tension du moteur pour annuler l’écart.</div>` });

COURSE.push({ id: 'moteur', t: 'Moteur à courant continu', h: `
<h3>Équations</h3>
<div class="formula">u(t) = Rm·i(t) + Lm·di/dt + Ke·ωm(t)<br>Cm(t) = Kt·i(t)<br>J·dωm/dt + f·ωm = Cm − Cr</div>
<p>Rm est la résistance, Lm l’inductance, Ke la constante de force contre-électromotrice, Kt la constante de couple, J l’inertie ramenée à l’axe moteur, f le frottement visqueux et Cr le couple résistant (frottement sec, pesanteur).</p>
<h3>Fonction de transfert</h3>
<p>Avec Cr = 0 et dans le domaine de Laplace :</p>
<div class="formula">Ωm(p)/U(p) = Kt / [(Lm·p + Rm)(J·p + f) + Kt·Ke]</div>
<p>Sous forme canonique : Km / ((1 + T1·p)(1 + T2·p)) avec T2 = Lm/Rm très petit. On néglige T2 : on obtient un premier ordre.</p>
<div class="formula">Km = Kt / (Rm·f + Kt·Ke)     T = Rm·J / (Rm·f + Kt·Ke)</div>
<p>Pour f = 0 : Km = 1/Ke et T = Rm·J/(Kt·Ke). Avec les valeurs du jumeau (Rm = 2,32 Ω, Kt = Ke = 23,4 mN·m/A, J = 5·10⁻⁵ kg·m²) : Km ≈ 42 rad/s/V et T ≈ 0,21 s.</p>
<h3>Identification</h3>
<p>Un échelon de tension U0 donne une vitesse finale Km·U0 ; T est la durée pour atteindre 63 % de cette valeur. un frottement sec Cs réduit la vitesse finale d’environ Cs·Rm/(Kt·Ke) (en rad/s) : l’échelon doit être assez grand pour que cette perte reste faible.</p>
<div class="retain"><b>À retenir.</b> T augmente avec l’inertie (donc avec les masses), Km n’en dépend pas. L’inductance est négligeable ici.</div>` });

COURSE.push({ id: 'cinematique', t: 'Loi entrée-sortie', h: `
<p>La vis fait varier la longueur x d’un côté d’un triangle. D’après la loi publiée pour le MaxPID :</p>
<div class="formula">x(θ) = √( a² + b² + c² + 2c(a·cos θ − b·sin θ) )<br>β(θ) = ( x(0) − x(θ) ) / p</div>
<p>avec a = 69,5 mm, b = 82 mm, c = 80 mm, p = 4 mm/tr et β le nombre de tours de vis. On obtient x(0) = 170,5 mm et x(90°) = 69,5 mm : environ 25 tours de vis pour parcourir 90°.</p>
<h3>Gain local</h3>
<div class="formula">G(θ) = dθ/dβ = p / |dx/dθ|   (en rad/tr, ×180/π pour des °/tr)</div>
<p>G vaut environ 5,96 °/tr en θ = 0, 5,04 °/tr à 10°, 2,98 °/tr à 70° et 2,87 °/tr à 90°. La loi n’est donc <b>pas linéaire</b> : on la linéarise autour d’un point θ0 par θ ≈ θ0 + G(θ0)(β − β0), valable pour de petits déplacements.</p>
<div class="retain"><b>À retenir.</b> Le gain du bras dépend de la position, donc la rapidité et l’amortissement de l’asservissement aussi.</div>` });

COURSE.push({ id: 'asservissement', t: 'Asservissement proportionnel', h: `
<h3>Schéma-blocs linéarisé</h3>
<p>Autour de θ0 : écart ε = 44·(θc − θ) en points, commande Um = Ka·KP·ε avec Ka = 0,45·10⁻³ V par point, moteur Km/(1 + T·p), puis le bras : θ̇ = G(θ0)/(2π·N) · ωm, d’où un intégrateur.</p>
<div class="formula">FTBO(p) = K / ( p·(1 + T·p) )   avec   K = Ka·44·KP·Km·G(θ0) / (2π·N)</div>
<p>La FTBO est de <b>classe 1</b> : l’erreur statique à un échelon est nulle dans le modèle linéaire.</p>
<h3>Forme canonique</h3>
<div class="formula">FTBF(p) = 1 / ( 1 + p/K + (T/K)·p² )<br>ω0 = √(K/T)     ζ = 1/(2·√(K·T))</div>
<p>Quand KP augmente, K augmente, ζ diminue et le système devient oscillant. Le dépassement vaut D = exp(−π·ζ/√(1 − ζ²)) pour ζ < 1. Le cas critique ζ = 1 correspond à K·T = 1/4.</p>
<div class="retain"><b>À retenir.</b> Rapidité et dépassement sont en conflit avec un correcteur proportionnel : un KP plus grand accélère mais fait osciller.</div>` });

COURSE.push({ id: 'limites', t: 'Non-linéarités du jumeau', h: `
<p>Le jumeau complet ajoute au modèle linéaire :</p>
<ul>
<li><b>Saturation</b> de la tension à ±21,6 V : la commande ne peut pas suivre un correcteur trop fort.</li>
<li><b>Loi entrée-sortie non linéaire</b> : G varie de 5,96 à 2,87 °/tr.</li>
<li><b>Frottement sec</b> Cs : une zone où le bras ne bouge pas tant que la tension est trop faible.</li>
<li><b>Pesanteur</b> : couple dû à la structure et aux masses additionnelles, ramené sur l’axe moteur par le principe des puissances virtuelles.</li>
<li><b>Quantification</b> du capteur (12 bits) et <b>échantillonnage</b> du correcteur.</li>
</ul>
<p>Ces effets expliquent les écarts entre une simulation linéaire et un essai réel : erreur statique, temps de réponse plus long, dépassement plus faible à fort KP.</p>
<h3>Statut des données</h3>
<p>Les valeurs publiques (alimentation, saturation, capteur, pas de vis, géométrie, inertie et masses, gain d’adaptation) viennent des énoncés et TP du MaxPID. Les constantes électriques viennent du catalogue d’un moteur voisin (maxon RE 25 20 W) en attendant l’annexe du moteur 118778. Le rapport de réduction N, les frottements et le levier de la structure sont <b>calés</b>. Pour un travail quantitatif, recalez N, f et Cs en comparant le jumeau à une réponse mesurée (atelier Asservissement, zone « mesure »).</p>
<div class="retain"><b>À retenir.</b> Un jumeau n’est utile que recalé : confronter systématiquement simulation et mesure.</div>` });

COURSE.push({ id: 'bode', t: 'Bode et marges (PSI*)', h: `
<p>Pour un correcteur C(p), la FTBO du MaxPID vaut C(p) · K0 / ( p·(1 + T·p)·(1 + T2·p) ). On trace gain (dB) et phase en fonction de ω.</p>
<h3>Marges</h3>
<ul>
<li><b>ω_c</b> : pulsation de coupure à 0 dB.</li>
<li><b>Marge de phase</b> MΦ = 180° + arg FTBO(jω_c). Valeur usuelle visée : 45° ou plus.</li>
<li><b>Marge de gain</b> MG = −|FTBO(jω_π)| en dB, où ω_π est la pulsation de phase −180°.</li>
</ul>
<p>Règle pratique pour un système proche du second ordre : ζ ≈ MΦ/100 (MΦ en degrés, MΦ < 70°).</p>
<h3>Effet du correcteur et du retard</h3>
<ul>
<li>Augmenter KP : ω_c augmente, MΦ diminue.</li>
<li>Action intégrale : ajoute −90° vers les basses fréquences, MΦ diminue.</li>
<li>Action dérivée : ajoute de la phase avance autour de ω_c.</li>
<li>Retard d’échantillonnage Te/2 : −ω_c·Te/2 radian sans changer le gain.</li>
</ul>
<div class="retain"><b>À retenir.</b> Le réglage du correcteur est un compromis entre rapidité (ω_c grand) et marge de phase.</div>` });

COURSE.push({ id: 'pid', t: 'PID, windup, échantillonnage (PSI*)', h: `
<h3>Loi de commande de la carte</h3>
<p>D’après les TP du MaxPID, la commande est calculée sur l’écart ε en points : une action proportionnelle, une action intégrale pondérée par 1/4 et une action dérivée pondérée par 16 :</p>
<div class="formula">Um = Ka · [ KP·ε + (Ki/4)·∫ε dt + 16·Kd·dε/dt ]</div>
<p>Le jumeau applique cette loi à la période Te, avec un filtre d’ordre 1 (20 ms) sur la dérivée, puis la saturation à ±21,6 V.</p>
<h3>Rôle des termes</h3>
<ul>
<li><b>P</b> : rapidité, mais erreur statique en présence d’un couple perturbateur constant.</li>
<li><b>I</b> : annule l’erreur statique face à une perturbation constante, mais dégrade la marge de phase.</li>
<li><b>D</b> : amortit, mais amplifie le bruit, ici la quantification du capteur.</li>
</ul>
<h3>Windup et anti-windup</h3>
<p>Si la commande sature, l’intégrale continue de croître. À la désaturation, la commande reste trop grande : fort dépassement. Parade simple : <b>geler l’intégrale</b> quand la commande est saturée et que l’erreur tend à la maintenir saturée.</p>
<h3>Échantillonnage</h3>
<p>Un correcteur numérique de période Te se comporte comme un correcteur continu retardé de Te/2. Il faut Te petit devant la constante de temps de la boucle fermée.</p>
<div class="retain"><b>À retenir.</b> PI pour la précision face aux perturbations, D pour l’amortissement, anti-windup dès qu’une saturation est possible.</div>` });

COURSE.push({ id: 'glossaire', t: 'Glossaire et sources', h: `
<dl class="gloss">
<dt>Km</dt><dd>gain statique du moteur (rad/s par volt)</dd>
<dt>T</dt><dd>constante de temps mécanique du moteur</dd>
<dt>G(θ)</dt><dd>gain cinématique du bras, en degrés de bras par tour de vis</dd>
<dt>K</dt><dd>gain de boucle ouverte, FTBO = K / (p(1 + T·p))</dd>
<dt>ζ, ω0</dt><dd>amortissement et pulsation propre de la FTBF du second ordre</dd>
<dt>MΦ, MG</dt><dd>marge de phase et marge de gain</dd>
<dt>Windup</dt><dd>accumulation de l’intégrale pendant la saturation</dd>
</dl>
<h3>Sources consultées</h3>
<ul>
<li>Énoncé « Modélisation d’un axe asservi d’un robot cueilleur de pommes » (Eduscol STI) : équations du moteur, inertie, masses, démarche.</li>
<li>TP3 MaxPID (mnsi.fr) : saturation 21,6 V, codeur 12 bits, gain 0,45·10⁻³, essais KP = 20 et KP = 250.</li>
<li>TP « Performances des SLCI, robot Maxpid » (Defauchy) : loi du PID, 44 points par degré, masse de 0,65 kg à 26 cm.</li>
<li>Projet « maxpid-asservissement » (GitHub) : loi entrée-sortie, géométrie du bras, pas de vis de 4 mm.</li>
<li>Fiche catalogue maxon RE 25 : constantes électriques du moteur voisin.</li>
</ul>
<p>Ces sources ne donnent pas toutes les mêmes valeurs moteur : le jumeau retient une valeur unique et la signale comme telle dans l’atelier « Le système ».</p>` });
