<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jumeau numérique MaxPID · SII PCSI/PSI*</title>
<style>
  :root{
    --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
    --bg:#ffffff;--bar:#eeeeee;--panel:#ffffff;--panel2:#f1f3f6;--field:#ffffff;--line:#b9bfc7;
    --fg:#111111;--muted:#5a6068;--accent:#2e6da4;--accent-fg:#ffffff;--accent-soft:#dcebf8;--accent-ink:#1b4a76;
    --ok:#1e7a2e;--warn:#9a5b00;--bad:#c0281f;--violet:#7b4fc2;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui)}
  .inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #app{height:100%;display:flex;flex-direction:column;min-height:0}
  .band{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
  .row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.01em}
  .brand small{font-weight:400;color:var(--muted);font-size:13px}
  .files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .btn{font-weight:500;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  .btn.sm{padding:3px 8px;font-size:12px}
  :is(button,input,select,textarea,summary):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:100%;overflow-x:auto}
  .seg button{border:0;background:transparent;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
  .work{flex:1;min-height:0;display:flex;gap:10px;padding-block:10px}
  #stage{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
  #hint{flex:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bar)}
  #scroller{flex:1;min-height:0;overflow:auto}
  .phead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex:none}
  .phead b{font-size:15px}
  .phead .sub{color:var(--muted);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
  .tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 10px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
  .tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
  .pbody{overflow:auto;padding:12px;flex:1;min-height:0}
  .fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-size:12.5px;color:var(--muted)}
  input[type=text],input[type=number],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--fg)}
  input[type=range]{width:100%;padding:0;accent-color:var(--accent)}
  .mono{font-family:var(--font-mono);font-size:12.5px}
  .small{font-size:12px;color:var(--muted);margin:0 0 9px}
  #act{flex:none;width:clamp(280px,24vw,340px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0;max-height:100%}
  #act .pbody{font-size:13.5px}
  .goal{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 10px;margin:0 0 10px}
  .steps{margin:0 0 10px;padding-left:20px}.steps li{margin-bottom:9px}
  .defi{border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;margin:0 0 12px}.defi p{margin:6px 0}
  .defi summary{cursor:pointer;font-weight:500;color:var(--accent-ink)}
  fieldset.q{border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px;margin:0 0 10px;min-width:0}
  fieldset.q legend{font-weight:600;padding:0 4px;max-width:100%}
  .opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;cursor:pointer}
  .opt input{margin-top:3px;width:auto;flex:none}
  .opt.good{background:rgba(30,122,46,.15)}.opt.bad{background:rgba(192,40,31,.15)}
  .why{font-size:12.5px;color:var(--muted);margin:6px 4px 2px}
  .score{font-weight:600;font-size:15px;margin:4px 0 8px}
  #course{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
  .ctop,.cwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .ctop{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--bar)}
  .cwrap{flex:1;min-height:0;display:flex;gap:28px;padding-block:14px}
  .ctoc{flex:none;width:250px;overflow:auto;display:flex;flex-direction:column;gap:1px}
  .ctoc button{display:block;width:100%;text-align:left;padding:6px 10px;border:0;border-left:3px solid transparent;background:transparent;cursor:pointer;font-size:13.5px}
  .ctoc button:hover{background:var(--panel2)}
  .ctoc button.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .ctoc-sel{display:none;margin:8px max(16px,env(safe-area-inset-left,0px)) 0;width:auto}
  .cbody{flex:1;min-width:0;overflow:auto;max-width:860px;padding-right:6px}
  .ckick{color:var(--muted);font-size:12.5px;margin:0}
  .cbody h2{font-size:26px;margin:2px 0 12px;text-wrap:balance}
  .cbody h3{font-size:16.5px;margin:22px 0 6px}
  .cbody p,.cbody li{font-size:14.5px;line-height:1.6}
  .cbody ul,.cbody ol{padding-left:22px}.cbody li{margin-bottom:4px}
  .cbody table{display:block;overflow-x:auto;max-width:100%}
  .ctable{border-collapse:collapse;font-size:13.5px;margin:8px 0 12px}
  .ctable th,.ctable td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
  .ctable th{background:var(--panel2);font-weight:600}
  .retain{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 12px;margin:16px 0 6px;font-size:14px}
  .formula{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;font-size:15px;overflow-x:auto;font-family:var(--font-mono)}
  pre.code{font:12.5px/1.55 var(--font-mono);margin:8px 0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
  .gloss{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;font-size:14px}.gloss dt{font-weight:600}.gloss dd{margin:0}
  .cpn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 32px}
  #ws{padding:16px max(16px,env(safe-area-inset-left,0px)) 30px;max-width:980px}
  #ws h2{font-size:24px;margin:0 0 8px;text-wrap:balance}
  #ws h3{font-size:16.5px;margin:24px 0 6px}
  #ws p,#ws li{font-size:14.5px;line-height:1.55}
  #ws .small{font-size:12.5px}
  .opts{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 10px}.opts .fld{margin:0}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
  .chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  .gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
  .stat{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
  .stat span{font-size:12px;color:var(--muted)}.stat b{font-size:14px;font-family:var(--font-mono);overflow-wrap:anywhere}
  .verdict{border-radius:8px;padding:9px 12px;margin:10px 0;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
  .verdict.yes{background:rgba(30,122,46,.15);border-color:var(--ok)}.verdict.no{background:rgba(192,40,31,.13);border-color:var(--bad)}.verdict.warn{background:rgba(154,91,0,.13);border-color:var(--warn)}
  .canvas-wrap{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;margin:8px 0;overflow-x:auto}
  canvas{display:block;max-width:100%;height:auto}
  .legend{display:flex;gap:10px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0}
  .legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:2px;margin-right:4px}
  @media (max-width:820px){
    .ctoc{display:none}.ctoc-sel{display:block}.cwrap{padding-top:8px}.cbody{padding-right:0}.gloss{grid-template-columns:1fr}.gloss dd{margin-bottom:6px}
    #act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px)}
    .work{flex-direction:column;gap:8px}
  }
</style>
</head>
<body>
<div id="app">
  <header class="band"><div class="inner row">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="3" y="14" width="4" height="9" fill="var(--accent)"/><rect x="9" y="9" width="4" height="14" fill="var(--ok)"/><rect x="15" y="5" width="4" height="18" fill="var(--warn)"/><rect x="21" y="11" width="2.5" height="12" fill="var(--bad)"/></svg>
      <span>Jumeau numérique MaxPID <small>SII · PCSI/PSI*</small></span>
    </div>
    <div class="files">
      <button class="btn" id="bAct" type="button" aria-pressed="false">Activité</button>
      <button class="btn" id="bCourse" type="button" aria-pressed="false">Cours</button>
      <button class="btn" id="bHelp" type="button">Aide</button>
    </div>
  </div></header>

  <div class="band" id="modes"><div class="inner row"><div class="seg" id="wsSeg" role="tablist" aria-label="Ateliers"></div></div></div>

  <main class="inner work" id="work">
    <section id="stage"><div id="hint"></div><div id="scroller"><div id="ws"></div></div></section>
    <aside id="act" hidden aria-label="Activité"></aside>
  </main>

  <section id="course" hidden aria-label="Cours"></section>
</div>

<div id="dlg" hidden></div>

<script>
(function() {
  'use strict';

  // Fonctions utilitaires renommées pour éviter tout conflit
  const qs = (s, r) => (r || document).querySelector(s);
  function mk(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v === false || v == null) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
    return el;
  }
  
  function isSmall(){ try { return window.matchMedia('(max-width:820px)').matches; } catch(e){ return false; } }
  const KEYS = { act: 'maxpid-jumeau-v4' };
  function lsGet(k,d){ try { const v=localStorage.getItem(k); return v?JSON.parse(v):d; } catch(e){ return d; } }
  function lsSet(k,v){ try { localStorage.setItem(k,JSON.stringify(v)); } catch(e){} }

  /* ==================================================================
     MODÈLE MAXPID ET SIMULATION
     ================================================================== */
  const MAXPID = {
    a: 70, b: 80, c: 80, p: 4, // Géométrie (mm)
    R: 1.1, Ke: 0.265, Kc: 0.265, Umax: 24, // Moteur
    r: 50, m_bras: 0.32, L_bras: 0.08, // Mécanique
    fv: 0.0008, Cf: 0.012,
    Km: 12, tau: 0.08, dt: 0.002, T: 4
  };

  function inertieEquivalente(m = MAXPID.m_bras) {
    const J_moteur = 0.0025, J_vis = 0.0001;
    const J_bras = m * MAXPID.L_bras * MAXPID.L_bras;
    return J_moteur + J_vis + J_bras / (MAXPID.r * MAXPID.r);
  }

  function coupleMaintien(thetaDeg) {
    const theta = thetaDeg * Math.PI / 180;
    return MAXPID.m_bras * 9.81 * MAXPID.L_bras * Math.cos(theta);
  }

  function simulerMaxpid(params) {
    const { Kp, Ki, Kd, consigne, type, T, masse, inclinaison, frottementSec, jeu } = params;
    const dt = MAXPID.dt, N = Math.floor(T / dt);
    const t = new Float64Array(N), theta = new Float64Array(N), omega = new Float64Array(N),
          u = new Float64Array(N), err = new Float64Array(N), couple = new Float64Array(N);
    let theta_m = 0, omega_m = 0, integral = 0, prev_err = 0;
    const m = masse || MAXPID.m_bras;
    const J = inertieEquivalente(m);
    const incl = (inclinaison || 0) * Math.PI / 180;
    
    for (let k = 0; k < N; k++) {
      const tk = k * dt; t[k] = tk;
      let c = 0;
      if (type === 'echelon') c = (tk >= 0.1) ? consigne : 0;
      else if (type === 'rampe') c = (tk >= 0.1) ? consigne * (tk - 0.1) : 0;
      
      const e = c - theta_m; err[k] = e;
      integral += e * dt;
      const deriv = (e - prev_err) / dt;
      let uc = Kp * e + Ki * integral + Kd * deriv;
      
      uc = Math.max(-MAXPID.Umax, Math.min(MAXPID.Umax, uc));
      u[k] = uc;
      
      const Cm = MAXPID.Kc * (uc / MAXPID.R);
      const Cg = m * 9.81 * MAXPID.L_bras * Math.cos(theta_m * Math.PI / 180 + incl);
      const Cvisq = MAXPID.fv * omega_m;
      const frot = (frottementSec && Math.abs(omega_m) > 1e-4) ? -Math.sign(omega_m) * MAXPID.Cf : 0;
      
      couple[k] = Cm - Cg - Cvisq + frot;
      omega_m += (couple[k] / J) * dt;
      theta_m += (180 / Math.PI) * omega_m / MAXPID.r * dt;
      
      if (jeu && Math.abs(theta_m - c) < 0.3) theta_m = c;
      
      theta[k] = theta_m; omega[k] = omega_m;
      prev_err = e;
    }
    return { t, theta, omega, u, couple, N };
  }

  /* ==================================================================
     ANIMATION 2D
     ================================================================== */
  function dessinerBras(canvas, thetaDeg, omegaRad, consigneDeg) {
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    
    const cx = W * 0.35, cy = H * 0.65;
    const L = Math.min(W, H) * 0.45;
    const theta = thetaDeg * Math.PI / 180;
    
    // Rapporteur
    ctx.strokeStyle = '#222'; ctx.lineWidth = 18;
    ctx.beginPath(); ctx.arc(cx, cy, L + 25, -Math.PI*0.8, Math.PI*0.8); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    for(let i=-80; i<=80; i+=5) {
      const a = i * Math.PI/180;
      const r1 = L + 16, r2 = (i%10===0) ? L + 24 : L + 20;
      ctx.beginPath();
      ctx.moveTo(cx + r1*Math.sin(a), cy - r1*Math.cos(a));
      ctx.lineTo(cx + r2*Math.sin(a), cy - r2*Math.cos(a));
      ctx.stroke();
    }

    // Bâti
    ctx.fillStyle = '#2e6da4';
    ctx.fillRect(cx - 20, cy, 40, H - cy);
    ctx.fillRect(cx - 60, cy + 10, 120, 30);
    ctx.fillStyle = '#1b4a76';
    ctx.fillRect(cx - 15, cy + 10, 30, 20);

    // Moteur
    ctx.fillStyle = '#2e8b3a';
    ctx.fillRect(cx - 100, cy - 15, 50, 30);
    ctx.fillStyle = '#b9bfc7';
    ctx.fillRect(cx - 50, cy - 10, 40, 20);
    ctx.strokeStyle = '#888'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(cx - 10, cy); ctx.lineTo(cx + L * Math.sin(theta), cy - L * Math.cos(theta)); ctx.stroke();

    // Bras
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(theta);
    ctx.fillStyle = '#e8d83a'; 
    ctx.beginPath();
    ctx.moveTo(-15, -10);
    ctx.lineTo(L - 10, -10);
    ctx.lineTo(L, 0);
    ctx.lineTo(L - 10, 10);
    ctx.lineTo(-15, 10);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#333';
    ctx.fillRect(0, -3, L*0.7, 6);
    ctx.fillStyle = '#a0a0a0';
    ctx.fillRect(L - 5, -20, 10, 40);
    ctx.fillRect(L - 20, -5, 40, 10);
    ctx.restore();

    // Pivot
    ctx.fillStyle = '#c0281f';
    ctx.beginPath(); ctx.arc(cx, cy, 10, 0, 2*Math.PI); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx, cy, 4, 0, 2*Math.PI); ctx.fill();

    // Consigne
    if (consigneDeg != null) {
      const tc = consigneDeg * Math.PI / 180;
      ctx.strokeStyle = '#9a5b00'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + L * Math.sin(tc), cy - L * Math.cos(tc));
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Afficheurs LCD
    ctx.fillStyle = '#111'; ctx.fillRect(cx + 40, cy - 80, 130, 50);
    ctx.fillStyle = '#e8a33a'; 
    ctx.font = 'bold 16px IBM Plex Mono, monospace';
    ctx.textAlign = 'left';
    ctx.fillText('Ω: ' + omegaRad.toFixed(1) + ' rad/s', cx + 50, cy - 60);
    ctx.fillStyle = '#2e8b3a';
    ctx.fillText('θ: ' + thetaDeg.toFixed(1) + ' °', cx + 50, cy - 40);
  }

  /* ==================================================================
     ATELIERS
     ================================================================== */
  let animTimer = null;

  function mountJumeau(root) {
    root.innerHTML = `
      <h2>Jumeau numérique du MaxPID</h2>
      <p>Ce jumeau numérique vous permet de configurer un essai et de lancer la simulation. L'animation du bras et les courbes temporelles évoluent en temps réel.</p>
      <div class="opts">
        <label class="fld"><span>Consigne (°)</span><input type="number" id="j-cons" value="45" min="5" max="90" step="5"></label>
        <div class="fld"><span>Type d'entrée</span><div id="j-type"></div></div>
        <label class="fld"><span>K<sub>p</sub></span><input type="range" id="j-kp" min="0" max="50" step="1" value="8"><b id="j-kp-out">8</b></label>
        <label class="fld"><span>K<sub>i</sub></span><input type="range" id="j-ki" min="0" max="20" step="0.5" value="0"><b id="j-ki-out">0</b></label>
        <label class="fld"><span>K<sub>d</sub></span><input type="range" id="j-kd" min="0" max="2" step="0.05" value="0"><b id="j-kd-out">0</b></label>
        <label class="fld"><span>Masse (kg)</span><input type="range" id="j-masse" min="0.1" max="1.5" step="0.1" value="0.32"><b id="j-masse-out">0.32</b></label>
      </div>
      <div class="opts">
        <label class="fld"><span><input type="checkbox" id="j-frot"> Frottement sec</span></label>
        <label class="fld"><span><input type="checkbox" id="j-jeu"> Jeu</span></label>
        <button class="btn pri" id="j-run" type="button" style="font-size:15px;padding:10px 20px;">▶ Lancer l'essai</button>
      </div>
      
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin:8px 0">
        <div class="canvas-wrap" style="flex:1;min-width:300px;background:#e0e6ed;">
          <canvas id="j-bras" width="400" height="300"></canvas>
        </div>
        <div class="canvas-wrap" style="flex:2;min-width:320px;">
          <canvas id="j-canvas" width="640" height="300"></canvas>
        </div>
      </div>
      
      <div class="legend"><span><i style="background:#2e6da4"></i>Position θ (°)</span><span><i style="background:#9a5b00"></i>Consigne</span><span><i style="background:#1e7a2e"></i>Vitesse moteur (/10)</span><span><i style="background:#c0281f"></i>Tension u (/5)</span><span><i style="background:#7b4fc2"></i>Couple (N·m)</span></div>
      <div id="j-indic"></div>
      <div id="j-msg" class="verdict" aria-live="polite">Prêt. Cliquez sur "Lancer l'essai" pour démarrer.</div>
    `;
    
    const typeEl = qs('#j-type');
    typeEl.append(mk('div', {class:'chips'}, [['echelon','Échelon'],['rampe','Rampe']].map(([id,lab])=>{
      const b = mk('button',{type:'button',class:'chip'+(id==='echelon'?' on':''),'data-type':id,onclick:()=>{ typeEl.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); b.classList.add('on'); }},lab);
      return b;
    })));
    
    ['kp','ki','kd','masse'].forEach(id => {
      const el = qs('#j-'+id), out = qs('#j-'+id+'-out');
      if (el && out) el.addEventListener('input', ()=>{ out.textContent = el.value; });
    });
    
    qs('#j-run').addEventListener('click', runEssai);
    
    dessinerBras(qs('#j-bras'), 0, 0, 45);
    drawTemporalGraph(qs('#j-canvas'), null, 0);
  }

  function runEssai() {
    if (animTimer) cancelAnimationFrame(animTimer);
    
    const cons = parseFloat(qs('#j-cons').value) || 45;
    const Kp = parseFloat(qs('#j-kp').value) || 0;
    const Ki = parseFloat(qs('#j-ki').value) || 0;
    const Kd = parseFloat(qs('#j-kd').value) || 0;
    const masse = parseFloat(qs('#j-masse').value) || 0.32;
    const type = qs('#j-type').querySelector('.chip.on').dataset.type;
    const frottementSec = qs('#j-frot').checked;
    const jeu = qs('#j-jeu').checked;
    
    const res = simulerMaxpid({ Kp, Ki, Kd, consigne: cons, type, T: 3, masse, inclinaison: 0, frottementSec, jeu });
    
    let idx = 0;
    const brasCanvas = qs('#j-bras');
    const graphCanvas = qs('#j-canvas');
    const msg = qs('#j-msg');
    
    msg.textContent = "Essai en cours...";
    msg.className = 'verdict warn';
    
    const speedFactor = 2;
    
    function animate() {
      if (idx >= res.N) {
        msg.textContent = "Essai terminé.";
        msg.className = 'verdict yes';
        updateIndicators(res, cons, masse);
        return;
      }
      
      dessinerBras(brasCanvas, res.theta[idx], res.omega[idx], cons);
      drawTemporalGraph(graphCanvas, res, idx);
      
      idx += Math.max(1, Math.floor(speedFactor * (MAXPID.dt / 0.016)));
      animTimer = requestAnimationFrame(animate);
    }
    
    animate();
  }

  function drawTemporalGraph(canvas, res, currentIndex) {
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0,0,W,H);
    
    const cons = parseFloat(qs('#j-cons').value) || 45;
    const maxTheta = Math.max(cons, 100) * 1.1;
    const pad = { l: 40, r: 15, t: 15, b: 25 };
    const plotW = W - pad.l - pad.r, plotH = H - pad.t - pad.b;
    
    ctx.strokeStyle = '#d0d5db'; ctx.lineWidth = 0.8;
    for (let g = 0; g <= 4; g++) { const yy = pad.t + (g/4)*plotH; ctx.beginPath(); ctx.moveTo(pad.l, yy); ctx.lineTo(W-pad.r, yy); ctx.stroke(); }
    ctx.strokeStyle = '#5a6068'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(pad.l, pad.t); ctx.lineTo(pad.l, H-pad.b); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad.l, H-pad.b); ctx.lineTo(W-pad.r, H-pad.b); ctx.stroke();
    
    ctx.fillStyle = '#5a6068'; ctx.font = '11px IBM Plex Mono'; ctx.textAlign = 'right';
    for (let g = 0; g <= 4; g++) { ctx.fillText((maxTheta*(1-g/4)).toFixed(0), pad.l-5, pad.t + (g/4)*plotH + 4); }
    ctx.textAlign = 'center';
    for (let g = 0; g <= 4; g++) { ctx.fillText((g/4*3).toFixed(1)+'s', pad.l + (g/4)*plotW, H-pad.b+15); }
    
    if (!res) return;
    
    const N = res.N;
    const x = i => pad.l + (i / (N-1)) * plotW;
    const yTheta = v => pad.t + plotH - (v / maxTheta) * plotH;
    
    ctx.strokeStyle = '#9a5b00'; ctx.lineWidth = 1.5; ctx.setLineDash([4,4]);
    ctx.beginPath();
    for (let i = 0; i < currentIndex; i+=2) {
      let c = res.t[i] >= 0.1 ? cons : 0;
      const xx = x(i), yy = yTheta(c); i===0 ? ctx.moveTo(xx,yy) : ctx.lineTo(xx,yy);
    }
    ctx.stroke(); ctx.setLineDash([]);
    
    ctx.strokeStyle = '#2e6da4'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i = 0; i < currentIndex; i+=2) {
      const xx = x(i), yy = yTheta(res.theta[i]); i===0 ? ctx.moveTo(xx,yy) : ctx.lineTo(xx,yy);
    }
    ctx.stroke();
    
    ctx.strokeStyle = '#c0281f'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x(currentIndex), pad.t); ctx.lineTo(x(currentIndex), H-pad.b); ctx.stroke();
  }

  function updateIndicators(res, cons, masse) {
    const final = res.theta[res.N-1];
    const err_stat = cons - final;
    let maxv = -Infinity;
    for (let k = 0; k < res.N; k++) if (res.theta[k] > maxv) maxv = res.theta[k];
    const dep = Math.max(0, (maxv - cons) / cons * 100);
    
    const box = qs('#j-indic'); if (box) {
      box.innerHTML = '';
      box.append(mk('div',{class:'gstats'},[
        ['Erreur statique', err_stat.toFixed(2)+' °'],
        ['Dépassement', dep.toFixed(1)+' %'],
        ['Inertie équivalente J<sub>eq</sub>', (inertieEquivalente(masse)*1000).toFixed(2)+' g·m²'],
        ['Couple de maintien', coupleMaintien(final).toFixed(3)+' N·m']
      ].map(([lab,val])=>mk('div',{class:'stat'},mk('span',{html:lab}),mk('b',null,val)))));
    }
  }

  /* --- Autres ateliers --- */
  function mountCinematique(root) {
    root.innerHTML = `
      <h2>Cinématique : loi entrée-sortie</h2>
      <p>Le système vis-écrou transforme la rotation de la vis en translation de l'écrou, ce qui fait tourner le bras.</p>
      <div class="formula">x(t) = (p / 2π) · α<sub>m</sub>(t)</div>
      <div class="opts">
        <label class="fld"><span>Rotation vis α<sub>m</sub> (°)</span><input type="range" id="c-alpha" min="-360" max="360" step="5" value="0"><b id="c-alpha-out">0</b></label>
      </div>
      <div class="canvas-wrap"><canvas id="c-canvas" width="640" height="240"></canvas></div>
      <div id="c-out" class="gstats"></div>
      <div class="verdict" id="c-msg"></div>
    `;
    qs('#c-alpha').addEventListener('input', drawCinematique);
    drawCinematique();
  }

  function drawCinematique() {
    const alphaDeg = parseFloat(qs('#c-alpha')?.value) || 0;
    qs('#c-alpha-out').textContent = alphaDeg;
    const alpha = alphaDeg * Math.PI / 180;
    const x = (MAXPID.p / (2 * Math.PI)) * alpha;
    const thetaRad = Math.atan2(x, MAXPID.a + MAXPID.b);
    const thetaDeg = thetaRad * 180 / Math.PI;
    
    const canvas = qs('#c-canvas'); if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    
    const cx = W * 0.3, cy = H * 0.7, L = H * 0.5;
    ctx.strokeStyle = '#5a6068'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(W*0.1, cy); ctx.lineTo(W*0.9, cy); ctx.stroke();
    
    ctx.strokeStyle = '#2e6da4'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(cx - 40, cy - 10); ctx.lineTo(cx + 40, cy - 10); ctx.stroke();
    
    const ex = cx + x * 2;
    ctx.fillStyle = '#9a5b00'; ctx.fillRect(ex - 8, cy - 18, 16, 16);
    
    const bx = ex + L * Math.sin(thetaRad), by = cy - L * Math.cos(thetaRad);
    ctx.strokeStyle = '#1e7a2e'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ex, cy - 10); ctx.lineTo(bx, by); ctx.stroke();
    
    const box = qs('#c-out'); if (box) {
      box.innerHTML = '';
      box.append(mk('div',{class:'gstats'},[
        ['Translation x', x.toFixed(2)+' mm'],
        ['Angle bras θ', thetaDeg.toFixed(2)+' °']
      ].map(([lab,val])=>mk('div',{class:'stat'},mk('span',{html:lab}),mk('b',null,val)))));
    }
    qs('#c-msg').innerHTML = `Pour α<sub>m</sub> = ${alphaDeg}°, x = ${x.toFixed(2)} mm et θ = ${thetaDeg.toFixed(2)}°.`;
  }

  function mountStatique(root) {
    root.innerHTML = `
      <h2>Statique : couple de maintien</h2>
      <div class="formula">C<sub>maintien</sub>(θ) = m · g · L · cos(θ)</div>
      <div class="opts">
        <label class="fld"><span>Angle θ (°)</span><input type="range" id="s-theta" min="0" max="90" step="5" value="45"><b id="s-theta-out">45</b></label>
        <label class="fld"><span>Masse m (kg)</span><input type="range" id="s-masse" min="0.1" max="1.5" step="0.1" value="0.32"><b id="s-masse-out">0.32</b></label>
      </div>
      <div class="canvas-wrap"><canvas id="s-canvas" width="640" height="280"></canvas></div>
      <div id="s-out" class="gstats"></div>
    `;
    qs('#s-theta').addEventListener('input', drawStatique);
    qs('#s-masse').addEventListener('input', drawStatique);
    drawStatique();
  }

  function drawStatique() {
    const thetaDeg = parseFloat(qs('#s-theta')?.value) || 45;
    const m = parseFloat(qs('#s-masse')?.value) || MAXPID.m_bras;
    qs('#s-theta-out').textContent = thetaDeg;
    qs('#s-masse-out').textContent = m;
    const C = m * 9.81 * MAXPID.L_bras * Math.cos(thetaDeg * Math.PI / 180);
    
    const canvas = qs('#s-canvas'); if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    const cx = W/2, cy = H*0.8, L = H*0.6, theta = thetaDeg * Math.PI/180;
    
    ctx.fillStyle = '#5a6068'; ctx.fillRect(cx-30, cy+5, 60, 10);
    const bx = cx + L*Math.sin(theta), by = cy - L*Math.cos(theta);
    ctx.strokeStyle = '#2e6da4'; ctx.lineWidth = 8; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(bx,by); ctx.stroke();
    ctx.fillStyle = '#9a5b00'; ctx.beginPath(); ctx.arc(bx,by,10,0,2*Math.PI); ctx.fill();
    
    ctx.strokeStyle = '#c0281f'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx, by+40); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx-5, by+30); ctx.lineTo(bx, by+40); ctx.lineTo(bx+5, by+30); ctx.stroke();
    
    const box = qs('#s-out'); if (box) {
      box.innerHTML = '';
      box.append(mk('div',{class:'gstats'},[
        ['Couple de maintien', C.toFixed(3)+' N·m'],
        ['Couple maximal', (m*9.81*MAXPID.L_bras).toFixed(3)+' N·m']
      ].map(([lab,val])=>mk('div',{class:'stat'},mk('span',{html:lab}),mk('b',null,val)))));
    }
  }

  function mountInertie(root) {
    root.innerHTML = `
      <h2>Inertie équivalente</h2>
      <div class="formula">J<sub>eq</sub> = J<sub>moteur</sub> + J<sub>vis</sub> + (m · L²) / r²</div>
      <div class="opts">
        <label class="fld"><span>Masse m (kg)</span><input type="range" id="i-masse" min="0.1" max="1.5" step="0.1" value="0.32"><b id="i-masse-out">0.32</b></label>
      </div>
      <div id="i-out" class="gstats"></div>
    `;
    qs('#i-masse').addEventListener('input', () => {
      const m = parseFloat(qs('#i-masse').value);
      qs('#i-masse-out').textContent = m;
      const J = inertieEquivalente(m);
      const box = qs('#i-out'); box.innerHTML = '';
      box.append(mk('div',{class:'gstats'},[
        ['J équivalent total', (J*1000).toFixed(2)+' g·m²']
      ].map(([lab,val])=>mk('div',{class:'stat'},mk('span',{html:lab}),mk('b',null,val)))));
    });
    qs('#i-masse').dispatchEvent(new Event('input'));
  }

  function mountDynamique(root) {
    root.innerHTML = `
      <h2>Dynamique</h2>
      <div class="formula">J<sub>eq</sub> · dω<sub>m</sub>/dt = C<sub>m</sub> − C<sub>r</sub> − f<sub>v</sub>·ω<sub>m</sub></div>
      <div class="formula">τ = R · J<sub>eq</sub> / (R·f<sub>v</sub> + K<sub>e</sub>·K<sub>c</sub>)</div>
      <p>La constante de temps augmente avec la masse embarquée.</p>
    `;
  }

  function mountNonLinearites(root) {
    root.innerHTML = `
      <h2>Non-linéarités en SLCI</h2>
      <p>Les non-linéarités (saturation, frottement sec, jeu) dégradent les performances. Testez-les dans l'atelier Jumeau Numérique.</p>
    `;
  }

  /* ==================================================================
     ACTIVITÉS ET COURS
     ================================================================== */
  const ACT = {
    jumeau: {
      title: "Jumeau numérique MaxPID", level: "Niveau 1 · Découvrir", time: "30 min",
      goal: "Prendre en main le modèle complet et observer l'influence des gains du PID.",
      steps: [
        "Lancez l'essai avec Kp = 8, Ki = 0. Relevez l'erreur statique.",
        "Activez l'intégrateur (Ki = 5) et vérifiez que l'erreur statique devient nulle.",
        "Augmentez la masse à 1 kg : que devient l'inertie équivalente ?",
        "Cochez « Frottement sec » et observez l'apparition d'oscillations."
      ],
      defi: {
        q: "Pourquoi le couple de maintien est-il maximal lorsque le bras est horizontal ?",
        a: "Le couple dû au poids est C = m·g·L·cos(θ). À l'horizontale (θ = 0°), cos(0) = 1 : le bras de levier est maximal."
      },
      qcm: [
        { q: "Quel terme du correcteur annule l'erreur statique sur un échelon ?", o: ["Kp", "Ki", "Kd", "Aucun"], a: 1, w: "Ki introduit une intégration supplémentaire." }
      ]
    }
  };

  const COURSE = [
    { id:'modele', t:'Modèle du MaxPID', h:`<p>Le MaxPID est un bras robotisé à vis à billes actionné par un moteur à courant continu. Le modèle de connaissance permet de simuler son comportement.</p>` }
  ];

  /* ==================================================================
     UI
     ================================================================== */
  const WORKSHOPS = [];
  WORKSHOPS.push({ id:'jumeau', title:'Jumeau numérique', hint:'Réglez le PID, lancez l\'essai et observez le bras en temps réel.', mount: mountJumeau, reset: ()=>{} });
  WORKSHOPS.push({ id:'cinematique', title:'Cinématique', hint:'Loi entrée-sortie vis-écrou.', mount: mountCinematique, reset: ()=>{} });
  WORKSHOPS.push({ id:'statique', title:'Statique', hint:'Couple de maintien gravitaire.', mount: mountStatique, reset: ()=>{} });
  WORKSHOPS.push({ id:'inertie', title:'Inertie équivalente', hint:'Ramenez les inerties à l\'arbre moteur.', mount: mountInertie, reset: ()=>{} });
  WORKSHOPS.push({ id:'dynamique', title:'Dynamique', hint:'Équation de mouvement et constante de temps.', mount: mountDynamique, reset: ()=>{} });
  WORKSHOPS.push({ id:'nonlin', title:'Non-linéarités', hint:'Saturation, frottement sec et jeu.', mount: mountNonLinearites, reset: ()=>{} });

  const UI = { cur: 'jumeau' };
  const AS = { key: 'jumeau', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null };
  const CS = { open: false, id: 'modele' };

  function wsById(id){ return WORKSHOPS.find(w=>w.id===id) || WORKSHOPS[0]; }
  function renderSeg(){
    const seg = qs('#wsSeg'); seg.innerHTML = '';
    WORKSHOPS.forEach((w,i)=>seg.append(mk('button',{type:'button',role:'tab','aria-pressed':w.id===UI.cur?'true':'false','aria-selected':w.id===UI.cur?'true':'false',onclick:()=>gotoWs(w.id)},(i+1)+'. '+w.title)));
  }
  function mountWs(){
    const w = wsById(UI.cur), root = qs('#ws');
    qs('#hint').textContent = w.hint; root.innerHTML='';
    w.mount(root);
    const sc=qs('#scroller'); if(sc) sc.scrollTop=0;
  }
  function gotoWs(id){
    const old = wsById(UI.cur); if(old.leave) old.leave();
    if(CS.open){ CS.open=false; renderCourse(); }
    UI.cur=id; AS.key=id; AS.tab='steps';
    renderSeg(); mountWs(); renderAct();
  }
  function actSave(){ lsSet(KEYS.act, AS.st); }
  function actState(){ return AS.st[AS.key] || (AS.st[AS.key]={a:{},checked:false,shown:false}); }
  function actScore(a){ const s=actState(); return a.qcm.filter((q,i)=>s.a[i]===q.a).length; }

  function renderAct(){
    const box=qs('#act'), btn=qs('#bAct');
    btn.setAttribute('aria-pressed', AS.open?'true':'false'); btn.classList.toggle('pri', AS.open);
    box.hidden = !AS.open;
    if(!AS.open){ box.innerHTML=''; return; }
    const a = ACT[AS.key];
    if(!a){ box.append(mk('div',{class:'pbody'},mk('p',null,'Activité en préparation.'))); return; }
    
    box.innerHTML = '';
    const close = mk('button',{class:'btn sm',type:'button',onclick:()=>{ AS.open=false; renderAct(); }},'Fermer');
    box.append(mk('div',{class:'phead'},mk('b',null,'Activité'),mk('span',{class:'sub'},a.title),close));
    const nq = a.qcm.length;
    box.append(mk('div',{class:'tabs',role:'tablist'},
      mk('button',{type:'button',role:'tab','aria-selected':AS.tab==='steps'?'true':'false',onclick:()=>{AS.tab='steps';renderAct();}},'Consignes'),
      mk('button',{type:'button',role:'tab','aria-selected':AS.tab==='qcm'?'true':'false',onclick:()=>{AS.tab='qcm';renderAct();}},'Questions ('+nq+')')));
      
    const body = mk('div',{class:'pbody'});
    if(AS.tab==='steps'){
      body.append(mk('p',{class:'small'},a.level+' · environ '+a.time), mk('div',{class:'goal'},mk('b',null,'Objectif. '),a.goal));
      body.append(mk('ol',{class:'steps'},a.steps.map(s=>mk('li',{html:s}))));
      body.append(mk('div',{class:'defi'},mk('b',null,'Défi'),mk('p',{html:a.defi.q}),mk('details',null,mk('summary',null,'Voir la réponse'),mk('p',{html:a.defi.a}))));
    } else {
      const s=actState(), show=s.checked||s.shown;
      a.qcm.forEach((q,i)=>{
        const fs = mk('fieldset',{class:'q'},mk('legend',null,(i+1)+'. '+q.q));
        q.o.forEach((o,j)=>{
          const good = show && j===q.a, bad = s.checked && !s.shown && s.a[i]===j && j!==q.a;
          const inp = mk('input',{type:'radio',name:'q'+i,checked: show && s.shown ? j===q.a : s.a[i]===j,disabled:show});
          inp.addEventListener('change',()=>{ s.a[i]=j; actSave(); renderAct(); });
          fs.append(mk('label',{class:'opt'+(good?' good':'')+(bad?' bad':'')},inp,mk('span',null,o+(good?'  ✓':'')+(bad?'  ✗':''))));
        });
        if(show){ const miss = s.a[i]==null && !s.shown; fs.append(mk('p',{class:'why'},(miss?'Sans réponse. ':'')+q.w)); }
        body.append(fs);
      });
      if(s.checked && !s.shown) body.append(mk('p',{class:'score'},'Score : '+actScore(a)+' / '+nq));
    }
    box.append(body);
  }

  qs('#bAct').addEventListener('click', ()=>{ AS.open=!AS.open; renderAct(); });

  function courseSection(id){ return COURSE.find(s=>s.id===id) || COURSE[0]; }
  function renderCourse(){
    const box=qs('#course'), btn=qs('#bCourse'), work=qs('#work');
    btn.setAttribute('aria-pressed', CS.open?'true':'false'); btn.classList.toggle('pri', CS.open);
    box.hidden=!CS.open; work.hidden=CS.open; qs('#modes').hidden=CS.open;
    if(!CS.open){ box.innerHTML=''; return; }
    box.innerHTML='';
    const cur = courseSection(CS.id);
    const art = mk('article',{class:'cbody'});
    art.append(mk('p',{class:'ckick'},'Cours'),mk('h2',null,cur.t),mk('div',{html:cur.h}));
    const top = mk('div',{class:'ctop'},mk('b',null,'Cours : MaxPID'),mk('button',{class:'btn pri sm',type:'button',onclick:()=>{ CS.open=false; renderCourse(); }},'Retour'));
    box.append(top,mk('div',{class:'cwrap'},art));
  }
  qs('#bCourse').addEventListener('click', ()=>{ CS.open=!CS.open; renderCourse(); });

  qs('#bHelp').addEventListener('click',()=>{
    alert("Jumeau numérique MaxPID :\n- Cliquez sur Lancer l'essai pour voir le bras bouger.\n- Testez l'influence des gains PID et de la masse.");
  });

  // Initialisation
  (function init(){
    AS.open = !isSmall();
    renderSeg();
    mountWs();
    renderAct();
    renderCourse();
  })();

})();
</script>
</body>
</html>
