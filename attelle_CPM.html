<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);

  return el;
}
function isSmall() { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } }
const KEYS = { act: 'cpm-twin-v1' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }
let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3500); }
const WORKSHOPS = [];
/*LOGIC-START*/
const D2R = Math.PI / 180, G0 = 9.81;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
/* géométrie générique : vérin de longueur x entre deux points, bras a et c, angle du triangle = θ + OFF */
const GEO = { a: 0.10, c: 0.16, off: 30 };
const xOf = thDeg => Math.sqrt(GEO.a ** 2 + GEO.c ** 2 - 2 * GEO.a * GEO.c * Math.cos((thDeg + GEO.off) * D2R));
const thOf = x => Math.acos(clamp((GEO.a ** 2 + GEO.c ** 2 - x * x) / (2 * GEO.a * GEO.c), -1, 1)) / D2R - GEO.off;
const dxdth = thDeg => GEO.a * GEO.c * Math.sin((thDeg + GEO.off) * D2R) / xOf(thDeg);   /* m/rad */
const TH_MIN = -10, TH_MAX = 120;
const Q0 = { R: 1.0, L: 0.3e-3, kt: 0.025, ke: 0.025, J: 1.0e-5, f: 1e-6, cs: 5e-3, N: 16, p: 0.005, Umax: 24, Imax: 3, wmax: 630,
  m: 4.0, lg: 0.25, incl: 30, kpat: 0.4, wi: 1000, wv: 150, Kp: 5, Ki: 0, Kd: 0, ff: true };
const Ileg = Q => Q.m * (Q.lg ** 2 + 0.05);
/* gain cinématique dθ/dφ_moteur (rad/rad) */
const Gk = (Q, thDeg) => (Q.p / (2 * Math.PI * Q.N)) / dxdth(thDeg);
const xmin = xOf(TH_MIN);
/* couples côté genou (N·m, positif = vers la flexion) */
const Cgrav = (Q, thDeg) => Q.m * G0 * Q.lg * Math.cos((Q.incl - thDeg) * D2R);
const Cstiff = (Q, thDeg) => Q.kpat * (Math.max(0, thDeg - 100) - Math.max(0, -5 - thDeg));
const loopGains = Q => { const Kpv = Q.J * Q.wv / Q.kt; return { Kpc: Q.L * Q.wi, Kic: Q.R * Q.wi, Kpv, Kiv: Kpv * Q.wv / 4 }; };
/* profil trapézoïdal de vitesse : amplitude D (°), vitesse max v (°/s), accélération a (°/s²) */
function trap(D, v, a) {
  let ta = v / a, tc = D / v - ta; if (tc < 0) { ta = Math.sqrt(D / a); tc = 0; v = a * ta; }

  return { T, f };

/* cycle : θa → θb, palier, retour. renvoie {T, f(t) = [pos, vel]} */
function cycle(thA, thB, v, a, dwell) {
  const D = Math.abs(thB - thA), s = Math.sign(thB - thA) || 1, tp = trap(D, v, a);

/* simulation de l'asservissement en cascade (position PID → vitesse PI → courant PI) */

    const r = o.ref(t), thr = r[0], vr = r[1];

      a: 'Côté moteur : 40 × 5,3·10⁻⁴ ≈ <b>21 mN·m</b>, soit i = C/Kt ≈ 0,85 A : le moteur le compense sans difficulté. Dans le vérin : F = C / (dx/dθ) = 40/0,1 = <b>400 N</b>. Le capteur de 50 kg mesure jusqu’à environ 490 N : il suffit de justesse.' },
    qcm: [
      { q: 'Pourquoi l’anticipation de vitesse réduit-elle beaucoup l’erreur de traînage ?', o: ['Elle augmente Kp', 'Elle fournit directement la vitesse demandée, sans écart nécessaire', 'Elle supprime la pesanteur', 'Elle filtre le bruit'], a: 1, w: 'Avec l’anticipation, la sortie du P n’a plus qu’à compenser l’écart résiduel : l’erreur passe d’environ 2° à 0,14°.' },

      { q: 'Quel est l’intérêt de la limitation d’effort pour le patient ?', o: ['Elle accélère le mouvement', 'Elle évite de blesser le patient en arrêtant ou en limitant l’axe lorsque l’effort dépasse un seuil', 'Elle économise l’énergie', 'Elle améliore la précision'], a: 1, w: 'Le capteur d’effort sert à protéger le patient : on arrête ou on inverse le mouvement au-delà d’un seuil.' },

      { q: 'Le capteur d’effort de 50 kg mesure au maximum environ…', o: ['5 N', '49 N', '490 N', '4 900 N'], a: 2, w: '50 kg × 9,81 m/s² ≈ 490 N.' }

/* ---------- cours ---------- */
const COURSE = [];
COURSE.push({ id: 'presentation', t: 'L’attelle CPM', h: `
<p>Une attelle <b>CPM</b> (continuous passive motion, mobilisation passive continue) fait fléchir et étendre le genou d’un patient opéré, sans effort de sa part, pour limiter la raideur articulaire. Le <b>CPM-130</b> est son équivalent didactique : il reprend le mécanisme d’une attelle réelle (Kinetec Prima Advance).</p>
<table class="ctable"><tr><th>Élément</th><th>Caractéristique publiée</th></tr>
<tr><td>Actionneur</td><td>vérin linéaire à vis à billes</td></tr>
<tr><td>Motorisation</td><td>motoréducteur maxon à courant continu, 24 V, 40 W, réduction 1:16</td></tr>
<tr><td>Amplitude du genou</td><td>−10° à 120°</td></tr>
<tr><td>Capteurs</td><td>angle du genou sans contact ; effort de traction de type S, 50 kg</td></tr>
<tr><td>Commande</td><td>carte EPOS de maxon : PI courant, PI vitesse, PID position</td></tr></table>
<h3>Modes de fonctionnement</h3>
<ul><li><b>Passif</b> : mobilisation motorisée, consigne en trapèze de vitesse et profil de position.</li><li><b>Actif</b> : le patient pousse, l’axe est asservi en couple et gère l’effort.</li><li><b>Labo</b> : le vérin sert de banc d’asservissement (position, vitesse, courant).</li></ul>
<div class="retain"><b>À retenir.</b> Le CPM est un système asservi en position dont la charge (la jambe) est vivante : il faut limiter vitesse et effort pour la sécurité du patient.</div>` });
COURSE.push({ id: 'cinematique', t: 'Loi entrée-sortie', h: `
<p>Le vérin est une jambe d’un triangle dont deux côtés a et c sont liés à la cuisse et à la jambe. Pour le jumeau, on retient la loi générique :</p>
<div class="formula">x² = a² + c² − 2·a·c·cos(θ + 30°)     avec a = 100 mm, c = 160 mm</div>
<p>On en déduit x(−10°) = 74 mm, x(120°) = 252 mm et une course de 177 mm. La cinématique réelle du CPM-130 n’est pas publiée : ces cotes sont des ordres de grandeur.</p>
<h3>Gain cinématique et conséquences</h3>
<div class="formula">dx/dθ = a·c·sin(θ + 30°) / x<br>dθ/dφm = ( p / (2π·N) ) / (dx/dθ)   (rad de genou par rad de moteur)<br>F = C / (dx/dθ)   (effort dans le vérin pour un couple C au genou)</div>
<p>La vitesse du moteur nécessaire pour une vitesse de genou donnée est proportionnelle à dx/dθ, et l’effort à 1/(dx/dθ). Les deux dépendent de l’angle.</p>
<div class="retain"><b>À retenir.</b> Une loi entrée-sortie non linéaire impose de dimensionner moteur et vis sur le pire angle, pas sur l’angle moyen.</div>` });
COURSE.push({ id: 'trapeze', t: 'Trapèze et dimensionnement', h: `
<p>Un profil de vitesse en <b>trapèze</b> comprend une accélération a, un palier à la vitesse v puis une décélération. Pour une amplitude D :</p>
<div class="formula">t_acc = v/a     t_palier = D/v − v/a     durée = 2·t_acc + t_palier</div>
<p>Si D < v²/a, il n’y a pas de palier : le profil devient triangulaire.</p>
<h3>Dimensionnement</h3>
<p>On remonte du mouvement au moteur sans simuler la régulation :</p>
<div class="formula">ωm = θ̇ / (dθ/dφm)     Cm = J·dωm/dt + f·ωm + Cs + (dθ/dφm)·C_genou     i = Cm/Kt     u = R·i + L·di/dt + Ke·ωm</div>
<p>On compare ensuite la vitesse, le courant et la tension à leurs limites. À 145 °/min, la tension nécessaire est d’environ 2,5 V pour 24 V disponibles : le moteur est surdimensionné pour cet usage didactique.</p>
<div class="retain"><b>À retenir.</b> À vitesse constante, la tension est dominée par Ke·ω ; au démarrage, le courant est dominé par J·dω/dt.</div>` });
COURSE.push({ id: 'cascade', t: 'Cascade de régulation', h: `
<p>La carte EPOS associe trois boucles imbriquées : une boucle de <b>courant</b> (PI), une de <b>vitesse</b> (PI) et une de <b>position</b> (PID). Chaque boucle fournit la consigne de la boucle interne.</p>
<div class="formula">position → consigne de vitesse → consigne de courant → tension du moteur</div>
<ul><li>La boucle de courant, rapide, impose le couple du moteur : Cm = Kt·i.</li><li>La boucle de vitesse règle ωm autour de sa consigne.</li><li>La boucle de position rend le genou conforme au profil.</li></ul>
<h3>Réglage d’école utilisé dans le jumeau</h3>
<p>Courant : Kp = L·ω_i et Ki = R·ω_i (compensation du pôle électrique), avec ω_i = 1000 rad/s. Vitesse : Kp = J·ω_v/Kt, avec ω_v = 150 rad/s. Position : Kp en s⁻¹, la sortie est une vitesse de genou convertie en vitesse moteur par le gain cinématique nominal à 45°. Les sorties sont saturées (±3 A, ±24 V) et les intégrales gelées en saturation.</p>
<h3>Erreur de traînage</h3>
<p>La boucle de position est de classe 1. Sur une rampe de vitesse v, l’erreur vaut ε = v/Kp. L’<b>anticipation</b> ajoute la vitesse de consigne à la sortie du correcteur et supprime presque entièrement cette erreur.</p>
<div class="retain"><b>À retenir.</b> Chaque boucle externe est plus lente que la boucle interne ; l’anticipation traite la rampe, le correcteur traite l’écart résiduel.</div>` });
COURSE.push({ id: 'bode', t: 'Marges et bande passante (PSI*)', h: `
<p>La boucle ouverte de position est le produit du correcteur, de la boucle de vitesse fermée Hω(p) et de l’intégrateur du vérin :</p>
<div class="formula">FTBO(p) = C(p) · (1/Gn) · Hω(p) · (dθ/dφm) / p</div>
<p>avec Gn le gain cinématique nominal et dθ/dφm celui de l’angle de fonctionnement. Hω est calculée à partir des équations du moteur et des deux PI :</p>
<div class="formula">Hω = Kt·Cc·Cv / [ (J·p + f)(R + L·p + Cc) + Kt·Ke + Kt·Cc·Cv ]</div>
<h3>Lecture</h3>
<ul><li>ω_c augmente avec Kp et avec le gain cinématique : plus l’angle est grand, plus la boucle est forte.</li><li>La marge de phase diminue quand ω_c approche la bande passante de la boucle de vitesse.</li><li>Un retard τ retire ω_c·τ radians de phase.</li></ul>
<div class="retain"><b>À retenir.</b> Le gain de boucle varie d’un facteur 3 sur la course : régler Kp au pire angle, ou compenser le gain cinématique.</div>` });
COURSE.push({ id: 'perturbation', t: 'Perturbations et sécurité (PSI*)', h: `
<p>La jambe du patient est une charge perturbatrice : pesanteur, raideur de l’articulation en fin de course, spasmes. Ramenée sur l’axe moteur par le gain cinématique, elle devient un couple très petit : 40 N·m au genou ne représentent qu’environ 21 mN·m côté moteur à 45°.</p>
<p>Conséquence : le moteur suit sans difficulté, mais l’<b>effort dans le vérin</b> peut atteindre plusieurs centaines de newtons. Le capteur d’effort de 50 kg (environ 490 N) permet de limiter l’effort et d’arrêter ou d’inverser le mouvement au-delà d’un seuil, pour ne pas blesser le patient.</p>
<ul><li><b>Intégrale</b> : annule l’erreur due à une perturbation lente, au prix d’une marge de phase réduite.</li><li><b>Dérivée</b> : peu utile ici, la boucle de vitesse amortit déjà.</li><li><b>Saturation et anti-windup</b> : on gèle l’intégrale quand la sortie est saturée.</li></ul>
<div class="retain"><b>À retenir.</b> La précision de suivi n’est pas le critère de sécurité : surveiller l’effort, pas seulement l’erreur de position.</div>` });
COURSE.push({ id: 'glossaire', t: 'Glossaire et sources', h: `
<dl class="gloss">
<dt>CPM</dt><dd>mobilisation passive continue</dd>
<dt>dθ/dφm</dt><dd>gain cinématique : rad de genou par rad de moteur</dd>
<dt>Trapèze</dt><dd>profil de vitesse : accélération, palier, décélération</dd>
<dt>Cascade</dt><dd>boucles de courant, vitesse et position imbriquées</dd>
<dt>Anticipation</dt><dd>ajout de la vitesse de consigne à la sortie du correcteur</dd>
<dt>ε = v/Kp</dt><dd>erreur de traînage d’une boucle de classe 1 sur une rampe</dd>
</dl>
<h3>Sources consultées</h3>
<ul>
<li>Fiche « CPM-130, attelle de mobilisation du genou » (Didastel) : actionneur, motoréducteur, capteurs, modes, amplitude, boucles EPOS.</li>
<li>Fiche produit de l’attelle de mobilisation du genou (ATV Systèmes) : mêmes données.</li>
<li>Manuel de l’attelle Kinetec Prima Advance : vitesses angulaires de 40 à 145 °/min, charge patient de 135 kg.</li>
</ul>
<h3>Ce qui n’est pas publié</h3>
<p>Les constantes électriques et mécaniques du moteur, le pas de la vis, la cinématique exacte du vérin, les inerties et les réglages d’usine de la carte EPOS ne figurent pas dans ces sources. Le jumeau les remplace par des valeurs génériques indiquées comme « calées » dans l’atelier 1, que vous pouvez modifier avec celles du dossier technique.</p>` });

const UI = { cur: 's1' };

function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }
function renderSeg() {

}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');

function gotoWs(id) {

function renderAct() {
  const box = $('#act'), btn = $('#bAct');

  box.hidden = !AS.open;

  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why' }, (miss ? 'Sans réponse. ' : '') + q.w)); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;

    '<h3>Limites du jumeau</h3><p>La fiche publique du CPM-130 ne donne ni les constantes du moteur, ni le pas de la vis, ni la cinématique exacte : ces valeurs sont calées. Vous pouvez les remplacer dans l’atelier 1.</p>' +
