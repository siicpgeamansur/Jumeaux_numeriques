const WORKSHOPS = [];

/* Doshydro : doseur à membrane à piston hydraulique, entraîné par moteur asynchrone + roue et vis + came */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TWO_PI = 2 * Math.PI, RPM = TWO_PI / 60, ATM = 1.013;
const Q0 = { Pn: 370, nn: 1440, fs: 50, pp: 2, Cmax: 2.5, J: 1.0e-3,           /* moteur asynchrone */
  N: 10, zr: 40, filets: 4, helix: 12.76, mu: 0.08, alpha: 20,                 /* roue et vis */
  c: 8, Qn: 240, pn: 2, Qmax: 230, pmax: 8,                                    /* piston, débit */
  Vb: 0.5, pre: 0.6, dpl: 0.3, k: 1.2 };                                         /* ballon, ligne */
const fcam0 = Q => (Q.nn / Q.N) / 60;                                         /* Hz, 2,4 */
const Aeff = Q => (Q.Qn / 3.6e6) / fcam0(Q) / (8e-3);                         /* m², déduit du débit à 8 mm */
const Qp = (Q, p) => Q.Qn - (Q.Qn - Q.Qmax) / (Q.pmax - Q.pn) * (p - Q.pn);   /* L/h à la pression p (bar) */
const etaV = (Q, p) => Qp(Q, p) / Q.Qn;
const Qmean = (Q, c, f, p) => Aeff(Q) * (c * 1e-3) * f * etaV(Q, p) * 3.6e6;  /* L/h */
const Cn = Q => Q.Pn / (Q.nn * RPM), ws = Q => TWO_PI * Q.fs / Q.pp, sn = Q => 1 - Q.nn * RPM / ws(Q);

const Cm = (Q, w) => { const s = 1 - w / ws(Q); if (Math.abs(s) < 1e-9) return 0; const m = sm(Q); return 2 * Q.Cmax * Cn(Q) / (s / m + m / s); };

const Ccam = (Q, c, th, p) => Math.max(0, Math.sin(th)) * p * 1e5 * Aeff(Q) * (c * 1e-3) / 2;              /* N·m sur la came */

/* ================= Atelier 6 : analyse harmonique ================= */
const S6 = { Vb: 0.5, pre: 0.6, dpl: 0.3, p: 2 };
function mount6(root) {
  root.append(h('h2', null, 'Analyse harmonique du débit'),
    h('p', null, 'Le débit d’un piston à came est une demi-sinusoïde redressée : son spectre contient la fréquence de rotation de la came et ses harmoniques paires. Le ballon et la ligne forment un filtre passe-bas du premier ordre qui les atténue.'));
  const box = h('div'), st = h('div'), tb = h('div'), msg = h('div', { class: 'verdict', id: 'm6' });
  const draw = () => {
    const Q = Object.assign({}, P, { Vb: S6.Vb, dpl: S6.dpl, pre: S6.pre }), f0 = fcam0(Q), Qm = Qmean(Q, 8, f0, S6.p) / 3.6e6, R = S6.dpl * 1e5 / Qm, g = gaz(Q, S6.p), tau = R * g.C, fs = [], H = [];
    for (let k = -1.5; k <= 1.5; k += 0.03) { const f = Math.pow(10, k); fs.push(f); H.push(-10 * Math.log10(1 + Math.pow(TWO_PI * f * tau, 2))); }
    box.innerHTML = ''; st.innerHTML = ''; tb.innerHTML = '';
    box.append(plot({ title: 'Atténuation du ballon et de la ligne', xn: 'f', logx: true, xl: 'fréquence (Hz)', yl: 'dB', h: 200, series: [{ x: fs, y: H, c: 'var(--c1)', l: 'gain' }], hl: [{ y: -3, l: '−3 dB' }] }));
    const rows = []; let sum = 0, sumH = 0;
    [1, 2, 4, 6].forEach(n => { const a = harm(n), hh = 1 / Math.sqrt(1 + Math.pow(TWO_PI * n * f0 * tau, 2)); sum += a; sumH += a * hh; rows.push(h('tr', null, h('td', null, n + ' × ' + fm(f0, 1) + ' Hz'), h('td', null, fm(a * 100, 0) + ' %'), h('td', null, fm(hh * 100, 0) + ' %'), h('td', null, fm(a * hh * 100, 1) + ' %'))); });
    tb.append(h('div', { class: 'dwrap' }, h('table', { class: 'dt' }, h('thead', null, h('tr', null, ['Harmonique', 'Amplitude sans ballon', 'Gain du filtre', 'Amplitude avec ballon'].map(x => h('th', null, x)))), h('tbody', null, rows))));
    const sim = simBallon(Q, { c: 8, p: S6.p, ballon: S6.Vb > 0.001 });
    st.append(stats([['Constante de temps R·C', fm(tau, 2) + ' s'], ['Fréquence de coupure', fm(1 / (TWO_PI * tau), 2) + ' Hz'], ['Fréquence de la came', fm(f0, 1) + ' Hz'], ['Atténuation de la fondamentale', fm(-20 * Math.log10(1 / Math.sqrt(1 + Math.pow(TWO_PI * f0 * tau, 2))) * 1, 1) + ' dB'], ['Irrégularité estimée (2 × somme)', fm(2 * sumH * 100, 0) + ' %'], ['Irrégularité simulée', fm(sim.dq * 100, 0) + ' %']]));
    setMsg('#m6', 'La fondamentale à ' + fm(f0, 1) + ' Hz est atténuée de ' + fm(-20 * Math.log10(1 / Math.sqrt(1 + Math.pow(TWO_PI * f0 * tau, 2))), 1) + ' dB. L’estimation par les harmoniques donne ' + fm(2 * sumH * 100, 0) + ' % d’irrégularité, la simulation temporelle ' + fm(sim.dq * 100, 0) + ' % : le calcul linéaire donne le bon ordre de grandeur.', 'ok');
  };
  root.append(h('div', { class: 'opts' }, sld('Volume du ballon', 0.1, 2, 0.1, S6.Vb, v => fm(v, 1) + ' L', v => { S6.Vb = v; later('d6', draw); }), sld('Pré-gonflage', 0, 1, 0.05, S6.pre, v => fm(v, 2) + ' × pression', v => { S6.pre = v; later('d6', draw); }), sld('Perte de charge de la ligne', 0.05, 1, 0.05, S6.dpl, v => fm(v, 2) + ' bar', v => { S6.dpl = v; later('d6', draw); }), sld('Pression de service', 1, 8, 0.5, S6.p, v => fm(v, 1) + ' bar', v => { S6.p = v; later('d6', draw); })), box, tb, st, msg);
  draw();
}

<p>La Doshydro est un <b>doseur à membrane à commande mécanique</b>. Un moteur asynchrone entraîne une came par une roue et vis ; la came pousse un piston qui déplace de l’huile ; l’huile déforme une membrane qui aspire et refoule le produit.</p>

<p>Un clapet de compensation DMR laisse entrer de l’huile quand il en manque en fin d’aspiration. La membrane travaille en déséquilibre de pression : ce type de doseur se limite aux basses pressions.</p>
<div class="retain"><b>À retenir.</b> Aucune boucle d’asservissement n’est décrite. Le jumeau suppose une came sinusoïdale et ajoute des valeurs calées (rendement, inertie, courbe du moteur, perte de charge). L’interprétation « réducteur de 10 = roue et vis 40/4 » est aussi une déduction.</div>

<p>Pour une came excentrée, le piston suit x(θ) = (c/2)(1 − cos θ), de vitesse v = (c/2)·ω·sin θ. Le piston refoule pour θ ∈ [0, π].</p>
<div class="formula">V<sub>coup</sub> = S·c     Q̄ = S·c·f     q(θ) = S·(c/2)·ω·sin θ  (0 ≤ θ ≤ π), 0 ensuite</div>
<p>Section déduite : S = 27,8 cm³ / 0,8 cm ≈ 34,7 cm². Le débit moyen est proportionnel à la course (120 L/h pour 4 mm) et à la cadence. Le débit maximal vaut π fois le débit moyen.</p>

<p>Le ballon de refoulement contient un gaz pré-gonflé. Quand la pression dépasse le pré-gonflage, du liquide y entre et comprime le gaz : le ballon stocke pendant le refoulement et restitue pendant l’aspiration.</p>
<div class="formula">p<sub>gaz</sub>·V<sub>gaz</sub><sup>k</sup> = cte     q<sub>sortie</sub> = q<sub>pompe</sub> − dV<sub>liquide</sub>/dt     p = p<sub>s</sub> + R·q<sub>sortie</sub></div>

<p>La pression agit sur le piston pendant le refoulement : le couple sur la came est C<sub>came</sub>(θ) = p·S·(c/2)·sin θ. Il est ramené au moteur par le rapport 10 et le rendement η de la roue et vis.</p>

  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', { type: 'button', class: s.id === cur.id ? 'on' : '', 'aria-current': s.id === cur.id ? 'true' : 'false', onclick: () => go(s.id) }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : la pompe doseuse Doshydro'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Six ateliers autour de la pompe doseuse à membrane Doshydro : système et cinématique, loi came-piston et réglage de course, débit et ballon amortisseur, couple et rendement, moteur asynchrone en charge, analyse harmonique du débit.</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut et déplacez les curseurs : les tracés se recalculent immédiatement.</li><li>Survolez un tracé pour lire les valeurs.</li><li>Le bouton <b>Activité</b> ouvre les consignes et un QCM corrigé ; <b>Cours</b> ouvre le cours associé ; <b>Mode sombre</b> bascule le thème.</li></ul>' +
    '<h3>Limites du jumeau</h3><p>Le seul document public décrit la pompe comme un doseur mécanique (moteur 0,37 kW, réducteur 10, course 8 mm, 144 coups/min, débit 240 L/h à 2 bar). Le jumeau complète par des valeurs calées, signalées et modifiables dans l’atelier 1 : loi de la came, rendement de la roue et vis, inertie, courbe du moteur, perte de charge, polytropique du ballon. Il ne modélise ni la membrane ni les clapets.</p>' +
    '<h3>Vos données</h3><p>Les réponses au QCM et le thème sont mémorisés dans ce navigateur uniquement.</p>' }));
});
function applyTheme(dark) {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const b = $('#bTheme'); b.setAttribute('aria-pressed', dark ? 'true' : 'false'); b.textContent = dark ? 'Mode clair' : 'Mode sombre';
}
$('#bTheme').addEventListener('click', () => { const d = document.documentElement.getAttribute('data-theme') !== 'dark'; applyTheme(d); lsSet('doshydro-theme', d ? 'dark' : 'light'); mountWs(); });
(function init() { applyTheme(lsGet('doshydro-theme', 'light') === 'dark'); AS.open = !isSmall(); renderSeg(); mountWs(); renderAct(); renderCourse(); })();
