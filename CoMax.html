const S6 = { F: 8, Kc: 5, dead: 10, lim: 5000, tau: 20, n: 2, notch: false, noise: 0, prof: 0 };
function Fprofile(S) {
  const A = S.F;
  if (S.prof === 1) return t => t < 0.5 ? 0 : t < 1.2 ? A : t < 2.2 ? 0 : t < 2.9 ? -A : 0;
  if (S.prof === 2) return t => t >= 0.5 && t < 0.7 ? 1.5 * A : 0;
  return t => t < 0.5 ? 0 : t < 0.8 ? A * (t - 0.5) / 0.3 : t < 1.3 ? A : t < 1.6 ? A * (1.6 - t) / 0.3 : 0;
}
function runCollab(S) {
  const Q = Object.assign({}, P, { n: S.n, Kc: S.Kc, dead: S.dead, lim: S.lim, tauf: S.tau / 1000, notch: S.notch }), nz = rng(7), F = Fprofile(S);
  return { Q, out: simulate(Q, { mode: 'collab', z0: S.prof === 1 ? 0.03 : 0.02, F, noise: S.noise ? () => (nz() + nz() + nz() - 1.5) * 1.15 * S.noise : null, tend: 6 }), F };
}

const COURSE = [];
COURSE.push({ id: 'presentation', t: 'Le robot CoMax', h: `
<p>CoMax est un <b>robot collaboratif</b> mono-axe : l’opérateur guide une charge lourde en la poussant à peine, et le robot fournit l’effort. Un axe linéaire vertical porte une poignée équipée d’un capteur de force et les masses à déplacer.</p>
<h3>Architecture</h3>
<table class="dt"><tbody>
<tr><td>Axe linéaire</td><td>poulie et courroie crantée, 108,2 mm par tour de poulie, course de 100 mm</td></tr>
<tr><td>Motorisation</td><td>moteur à courant continu maxon RE 40 (24 V, 150 W), réducteur épicycloïdal de rapport 15,88</td></tr>
<tr><td>Capteurs</td><td>codeur optique 500 points/tour sur le moteur ; capteur de force à jauge dans la poignée (2 kg)</td></tr>
<tr><td>Commande</td><td>carte EPOS 2 : boucles de courant, de vitesse et de position</td></tr>
<tr><td>Limites annoncées</td><td>3 m/s, 20 m/s², 10 kg</td></tr></tbody></table>
<h3>Modes de fonctionnement</h3>
<p>En <b>mode consigne</b>, on impose une position (profil trapézoïdal ou sinusoïdal), une vitesse ou un courant. En <b>mode collaboratif</b>, la tension du capteur de poignée est transformée en consigne de vitesse.</p>
<div class="retain"><b>À retenir.</b> Le jumeau utilise des valeurs documentées pour la chaîne cinématique et le moteur, et des valeurs calées pour la masse mobile, les frottements, l’inertie du réducteur et le conditionnement du capteur : un résultat chiffré n’est valable que dans ces limites.</div>
<h3>Sources</h3>
<p class="small">Dossier technique CoMax (cpge-grasshopper.fr) ; module de documentation sur sciencesindustrielles.com (réducteur 15,88, codeur 500 points, capteur de force 2 kg) ; manuel de l’IHM (EPOS 2, 108,2 mm par tour, 294 qc/mm) ; sujet eduscol « CoMax » (constante de couple 0,0302 N·m/A, masses de 1 kg) ; catalogue maxon, moteur RE 40 24 V.</p>` });
COURSE.push({ id: 'transmission', t: 'Transmission et charge', h: `
<p>Le moteur tourne à ω<sub>m</sub>, le réducteur divise par N = 15,88, la poulie convertit la rotation en translation : p = 108,2 mm par tour.</p>
<div class="formula">z = (p / (2π·N)) · φ<sub>m</sub> = 1,084 mm par radian moteur<br>v = k · ω<sub>m</sub>     F<sub>axe</sub> · k = C<sub>m</sub> (conservation de la puissance, rendement 1)</div>
<h3>Couple et courant</h3>
<div class="formula">C<sub>ext</sub> = (m<sub>0</sub> + n)·g·k     C<sub>m</sub> = C<sub>ext</sub> ± C<sub>fs</sub> + f·ω<sub>m</sub> + J·dω<sub>m</sub>/dt     I = C<sub>m</sub> / K<sub>t</sub></div>
<p>Pour la masse mobile seule, C<sub>ext</sub> ≈ 16 mN·m, soit 0,53 A de courant de maintien.</p>
<h3>Tension et vitesse limite</h3>
<div class="formula">U = R·I + K<sub>e</sub>·ω<sub>m</sub>     ω<sub>max à vide</sub> = U / K<sub>e</sub> ≈ 795 rad/s ≈ 7 590 tr/min</div>
<p>À 7 590 tr/min, l’axe irait à environ 0,86 m/s au plus. Les 3 m/s annoncés pour l’axe seul ne sont donc pas atteignables avec ce motoréducteur : ils demanderaient 26 400 tr/min.</p>
<div class="retain"><b>À retenir.</b> Vitesse, couple et courant se lisent côté moteur grâce à un seul facteur k = 1,084 mm/rad.</div>` });
COURSE.push({ id: 'identification', t: 'Identification', h: `
<p>À vitesse constante, le courant moyen se déduit d’un bilan de couples. Pour chaque masse, on mesure I pour plusieurs vitesses de signe positif puis négatif.</p>
<div class="formula">I<sup>±</sup>(ω) = (C<sub>ext</sub> ± C<sub>fs</sub> ± f·|ω|) / K<sub>t</sub></div>
<ul><li><b>Pente</b> de chaque demi-droite : f / K<sub>t</sub> (frottement visqueux).</li><li><b>Moyenne des intercepts</b> : C<sub>ext</sub> / K<sub>t</sub>, donc la masse (m = C<sub>ext</sub> / (g·k)).</li><li><b>Demi-écart des intercepts</b> : C<sub>fs</sub> / K<sub>t</sub> (frottement sec).</li></ul>
<p>La masse se déduit ensuite par régression de m en fonction du nombre n de masses ajoutées : l’ordonnée à l’origine donne m<sub>0</sub>, la pente la masse d’un bloc.</p>
<div class="retain"><b>À retenir.</b> Le frottement visqueux est le terme le plus faible : il est le premier à disparaître dans le bruit.</div>` });
COURSE.push({ id: 'asservissement', t: 'Asservissement en cascade', h: `
<p>Trois boucles imbriquées, de la plus rapide à la plus lente : courant (électrique), vitesse (mécanique), position.</p>
<ul><li><b>Courant</b> : correcteur PI qui compense la constante de temps électrique L/R ≈ 0,26 ms.</li>
<li><b>Vitesse</b> : correcteur PI réglé sur l’inertie totale J<sub>tot</sub> = J + (m₀+n)·k².</li>
<li><b>Position</b> : correcteur PID plus <b>anticipation</b> de vitesse (et d’accélération).</li></ul>
<div class="formula">erreur de traînage sans anticipation : e = v / K<sub>p</sub></div>
<h3>Dimensionnement thermique</h3>
<p>Le courant de pointe est limité par l’électronique (10 A dans le jumeau), le courant <b>efficace</b> par l’échauffement : I<sub>rms</sub> ≤ 5,77 A (courant nominal du RE 40). Sur le cycle par défaut, I<sub>rms</sub> ≈ 0,9 A ; avec 6 masses, 2,8 A ; en cycle rapide avec 6 masses, 3,7 A.</p>
<div class="retain"><b>À retenir.</b> L’anticipation supprime l’erreur de traînage sans augmenter le gain, donc sans dégrader la stabilité.</div>` });
COURSE.push({ id: 'stabilite', t: 'Stabilité et marges (PSI*)', h: `
<p>Si la boucle de vitesse est rapide devant la boucle de position, la boucle ouverte se réduit à K<sub>p</sub>/p : un intégrateur de gain K<sub>p</sub>.</p>
<div class="formula">ω<sub>c</sub> ≈ K<sub>p</sub>     M<sub>φ</sub> = 180° + arg H(jω<sub>c</sub>) ≈ 90° − (déphasage de la boucle de vitesse) − ω<sub>c</sub>·τ</div>
<p>Dans le jumeau : ω<sub>c</sub> = 35 rad/s avec M<sub>φ</sub> = 82° pour K<sub>p</sub> = 30 ; ω<sub>c</sub> = 105 rad/s avec M<sub>φ</sub> = 44° pour K<sub>p</sub> = 100 ; M<sub>φ</sub> = 27° pour K<sub>p</sub> = 200. Un retard de 2 ms ramène 44° à 32° à K<sub>p</sub> = 100.</p>
<p>La marge de phase prévoit le dépassement : 44° donne environ 18 %, 32° environ 30 %.</p>
<div class="retain"><b>À retenir.</b> Un retard coûte une phase proportionnelle à ω<sub>c</sub> : plus la boucle est rapide, plus elle est sensible aux retards.</div>` });
COURSE.push({ id: 'collaboratif', t: 'Mode collaboratif', h: `
<p>La commande n’a plus de trajectoire : la consigne de vitesse est construite à partir de l’effort de l’opérateur.</p>
<div class="formula">U<sub>f</sub> = K<sub>fs</sub>·F<sub>op</sub> → filtre → zone morte ±d → Ω<sub>c</sub> = K<sub>p</sub>·(U<sub>f</sub> − d·signe(U<sub>f</sub>)), puis limites de vitesse et d’accélération</div>
<p>Dans le régime établi, v = G·F avec G = K<sub>p</sub>·(2π/60)·K<sub>fs</sub>·k ≈ 11,4 mm/s par newton avec les réglages par défaut. Une poussée de 8,8 N donne 100 mm/s.</p>
<h3>Rôle des réglages</h3>
<ul><li><b>Gain</b> : rend la charge plus ou moins légère à guider.</li><li><b>Zone morte</b> : évite les mouvements dus au bruit ou aux efforts parasites.</li><li><b>Filtre</b> : réduit le bruit mais ajoute un retard.</li><li><b>Limites</b> : bornent la vitesse et l’accélération, par sécurité.</li></ul>
<p>L’effort de l’opérateur agit aussi mécaniquement sur la charge : la boucle de vitesse le traite comme une perturbation.</p>
<div class="retain"><b>À retenir.</b> Un réglage collaboratif est un compromis entre effort ressenti, réactivité et sécurité.</div>` });

  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : le robot CoMax et son asservissement'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Six ateliers autour du robot collaboratif CoMax : présentation du système, transmission et charge, identification des frottements, asservissement en position, analyse fréquentielle et mode collaboratif commandé par l’effort de l’opérateur.</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut et déplacez les curseurs : les tracés se recalculent immédiatement.</li><li>Survolez un tracé pour lire les valeurs.</li><li>Le bouton <b>Activité</b> ouvre les consignes et un QCM corrigé ; <b>Cours</b> ouvre le cours associé ; <b>Mode sombre</b> bascule le thème.</li></ul>' +
    '<h3>Limites du jumeau</h3><p>Les documents publics donnent la chaîne cinématique, le moteur (maxon RE 40) et les modes de commande, mais pas la masse de la partie mobile, les frottements, l’inertie du réducteur ni le conditionnement du capteur de force : ces valeurs sont calées et modifiables dans l’atelier 1. Le jumeau modélise un axe vertical sans élasticité de courroie.</p>' +
    '<h3>Vos données</h3><p>Les réponses au QCM et le thème sont mémorisés dans ce navigateur uniquement.</p>' }));
});
function applyTheme(dark) {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const b = $('#bTheme'); b.setAttribute('aria-pressed', dark ? 'true' : 'false'); b.textContent = dark ? 'Mode clair' : 'Mode sombre';
}
$('#bTheme').addEventListener('click', () => { const d = document.documentElement.getAttribute('data-theme') !== 'dark'; applyTheme(d); lsSet('comax-theme', d ? 'dark' : 'light'); mountWs(); });
(function init() { applyTheme(lsGet('comax-theme', 'light') === 'dark'); AS.open = !isSmall(); renderSeg(); mountWs(); renderAct(); renderCourse(); })();

</script>
